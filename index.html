<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo do Trator Infinito</title>
<script src="https://jsdelivr.net"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}
canvas{display:block;margin:auto}
</style>
</head>
<body>
<script>
const VEHICLES = [
 {id:"green",name:"Trator Verde",kind:"tractor",color:0x2e8b3c,price:0},
 {id:"red",name:"Trator Vermelho",kind:"tractor",color:0xd62828,price:50},
 {id:"blue",name:"Trator Azul",kind:"tractor",color:0x1976d2,price:100},
 {id:"yellow",name:"Trator Amarelo",kind:"tractor",color:0xf5b700,price:150},
 {id:"orange",name:"Trator Laranja",kind:"tractor",color:0xf07818,price:200},
 {id:"purple",name:"Trator Roxo",kind:"tractor",color:0x8e44ad,price:250},
 {id:"motoRed",name:"Moto Cross Vermelha",kind:"moto",color:0xe53935,price:300},
 {id:"motoBlue",name:"Moto Cross Azul",kind:"moto",color:0x2196f3,price:350},
 {id:"motoGreen",name:"Moto Cross Verde",kind:"moto",color:0x43a047,price:400},
 {id:"motoYellow",name:"Moto Cross Amarela",kind:"moto",color:0xffc107,price:450},
 {id:"motoBlack",name:"Moto Cross Preta",kind:"moto",color:0x303030,price:500},
 {id:"motoPurple",name:"Moto Cross Roxa",kind:"moto",color:0x9c27b0,price:550}
];

let totalCoins = Number(localStorage.getItem("tratorCoins") || 0);
let highScore = Number(localStorage.getItem("tratorRecord") || 0);
let selectedVehicle = localStorage.getItem("vehicleSelected") || "green";
let jumpButtonSize = Number(localStorage.getItem("tratorJumpSize") || 1);
let unlocked = JSON.parse(localStorage.getItem("vehiclesUnlocked") || '{"green":true}');

VEHICLES.forEach(v => { if (v.price === 0) unlocked[v.id] = true; });

let tractor, trailer, groundPieces, obstacles, overheadObstacles, coinsGroup, sceneryGroup;
let score = 0, coins = 0, lives = 3, gameSpeed = 230, gameOver = false, paused = false, jumpsUsed = 0;
let lastGroundX = 0, lastGroundY = 500, lastObstacleX = 0, lastOverheadX = 1200, currentBiome = -1;
let scoreText, coinsText, livesText, speedText, jumpButton, biomeText, pauseLayer, pauseBtn;
let audioCtx = null;
const MAX_JUMPS = 2;

function saveData() {
 localStorage.setItem("tratorCoins", totalCoins);
 localStorage.setItem("tratorRecord", highScore);
 localStorage.setItem("vehicleSelected", selectedVehicle);
 localStorage.setItem("vehiclesUnlocked", JSON.stringify(unlocked));
 localStorage.setItem("tratorJumpSize", jumpButtonSize);
}

function startAudio() {
 try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
}

function sound(type) {
 try {
  startAudio();
  let o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = ({ coin: 800, jump: 420, hit: 100, buy: 650, break: 180 }[type] || 300);
  o.type = "square";
  g.gain.setValueAtTime(.06, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .13);
  o.start(); o.stop(audioCtx.currentTime + .13);
 } catch (e) {}
}

function drawTexture(scene, key, w, h, fn) {
 let g = scene.make.graphics({ x: 0, y: 0, add: false });
 fn(g); g.generateTexture(key, w, h); g.destroy();
}

function createTextures(scene) {
 VEHICLES.forEach(v => drawTexture(scene, "vehicle_" + v.id, 160, 115, g => {
  if (v.kind === "tractor") {
   g.fillStyle(v.color); g.fillRoundedRect(25, 30, 102, 42, 7); g.fillRoundedRect(83, 14, 52, 35, 6);
   g.fillStyle(0x333333); g.fillRect(43, 2, 48, 40); g.fillStyle(0x9ddcff); g.fillRect(49, 8, 36, 27);
   g.fillStyle(0xffffa0); g.fillCircle(139, 35, 6); g.fillStyle(0x555555); g.fillRect(110, 0, 8, 25);
   g.fillStyle(0x171717); g.fillCircle(39, 80, 27); g.fillCircle(119, 78, 19);
   g.fillStyle(0x888888); g.fillCircle(39, 80, 13); g.fillCircle(119, 78, 9);
  } else {
   g.lineStyle(7, 0x252525); g.strokeCircle(35, 83, 24); g.strokeCircle(122, 83, 24);
   g.fillStyle(0x777777); g.fillCircle(35, 83, 10); g.fillCircle(122, 83, 10);
   g.lineStyle(7, v.color); g.lineBetween(35, 83, 66, 49); g.lineBetween(66, 49, 91, 82); g.lineBetween(91, 82, 35, 83);
   g.lineBetween(66, 49, 105, 47); g.lineBetween(105, 47, 122, 83); g.lineBetween(66, 49, 57, 29);
   g.lineStyle(5, 0x222222); g.lineBetween(48, 27, 72, 27); g.lineBetween(105, 47, 124, 37);
   g.fillStyle(v.color); g.fillRoundedRect(58, 31, 43, 19, 5); g.fillRoundedRect(80, 23, 21, 11, 4);
   g.fillStyle(0x222222); g.fillCircle(71, 17, 10); g.fillStyle(0xeeeeee); g.fillCircle(71, 17, 5);
   g.fillStyle(0xfff3a0); g.fillCircle(132, 39, 5);
  }
 }));
 drawTexture(scene, "trailer", 120, 80, g => {
  g.fillStyle(0x7c211c); g.fillRect(10, 20, 100, 35);
  g.fillStyle(0x555555); g.fillRect(100, 43, 20, 6);
  g.fillStyle(0x171717); g.fillCircle(35, 60, 20); g.fillCircle(85, 60, 20);
  g.fillStyle(0x888888); g.fillCircle(35, 60, 9); g.fillCircle(85, 60, 9);
  g.fillStyle(0xd8a83e); g.fillCircle(60, 12, 10);
 });
 drawTexture(scene, "ground", 120, 120, g => {
  g.fillStyle(0x80502b); g.fillRect(0, 0, 120, 120);
  g.fillStyle(0x3d8b32); g.fillRect(0, 0, 120, 15);
 });
 drawTexture(scene, "rock", 50, 50, g => { g.fillStyle(0x777777); g.fillCircle(25, 25, 24); g.fillStyle(0x999999); g.fillCircle(18, 16, 7); });
 drawTexture(scene, "hay", 64, 48, g => { g.fillStyle(0xd8a83e); g.fillRoundedRect(2, 4, 60, 42, 8); g.lineStyle(3, 0x9a6c25); g.strokeRoundedRect(2, 4, 60, 42, 8); });
 drawTexture(scene, "bighay", 110, 90, g => { g.fillStyle(0xbf9030); g.fillRoundedRect(4, 4, 102, 82, 12); g.lineStyle(5, 0x7c5314); g.strokeRoundedRect(4, 4, 102, 82, 12); });
 drawTexture(scene, "branch", 110, 28, g => { g.lineStyle(13, 0x6d4527); g.lineBetween(5, 14, 105, 14); g.lineStyle(7, 0x4d7e2a); g.lineBetween(32, 12, 20, 2); g.lineBetween(65, 13, 80, 1); });
 drawTexture(scene, "coin", 30, 30, g => { g.fillStyle(0xffd700); g.fillCircle(15, 15, 13); g.lineStyle(3, 0xfff59d); g.strokeCircle(15, 15, 9); });
 drawTexture(scene, "fence", 100, 55, g => { g.fillStyle(0xe6d2a4); g.fillRect(5, 8, 8, 44); g.fillRect(87, 8, 8, 44); g.fillRect(5, 15, 90, 7); g.fillRect(5, 35, 90, 7); });
 drawTexture(scene, "tree", 80, 120, g => { g.fillStyle(0x79502b); g.fillRect(32, 55, 17,65); g.fillStyle(0x2f873c); g.fillCircle(40, 40, 34); });
 drawTexture(scene, "barn", 150, 120, g => { g.fillStyle(0xb8332c); g.fillRect(15, 45, 120, 75); g.fillStyle(0x7c211c); g.fillPoints([{x:5,y:48},{x:75,y:2},{x:145,y:48}],true); });
 drawTexture(scene, "crop", 45, 90, g => { g.lineStyle(5, 0x3c7d2b); g.lineBetween(22, 90, 22, 20); g.fillStyle(0x3d963a); g.fillEllipse(12, 38, 24, 12); });
}

function button(scene, x, y, label, fn, style = {}) {
 let t = scene.add.text(x, y, label, {
  fontSize: style.size || "22px",
  fontStyle: "bold",
  backgroundColor: style.bg || "#249b45",
  padding: { left: style.pad || 15, right: style.pad || 15, top: 9, bottom: 9 },
  color: "#fff",
  align: "center"
 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
 t.on("pointerdown", (pointer, localX, localY, event) => {
  if(event) event.stopPropagation();
  fn();
 });
 return t;
}

class MenuScene extends Phaser.Scene {
 constructor() { super("MenuScene") }
 create() {
  createTextures(this); this.cameras.main.setBackgroundColor("#78c9f2"); this.add.rectangle(400, 470, 800, 260, 0x69a83b);
  this.add.text(400, 50, "🚜 TRATOR INFINITO 2.0", { fontSize: "29px", fontStyle: "bold", color: "#fff", stroke: "#333", strokeThickness: 5 }).setOrigin(0.5);
  this.add.image(400, 155, "vehicle_" + selectedVehicle).setScale(0.9);
  this.add.text(400, 230, "Veículo: " + (VEHICLES.find(v => v.id === selectedVehicle)?.name || ""), { fontSize: "18px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  this.add.text(400, 263, "💰 " + totalCoins + " moedas", { fontSize: "21px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  
  button(this, 400, 320, "▶ JOGAR", () => { startAudio(); this.scene.start("GameScene") }, { size: "26px" });
  button(this, 400, 385, "🚜 GARAGEM", () => this.scene.start("ShopScene"), { size: "18px", bg: "#80512b" });
  
  this.add.text(400, 445, "Tamanho do botão de pulo", { fontSize: "15px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  button(this, 310, 480, "−", () => { jumpButtonSize = Math.max(0.7, Math.round((jumpButtonSize - 0.15) * 100) / 100); saveData(); this.scene.restart() }, { bg: "#455a64", pad: 15 });
  this.add.text(400, 480, Math.round(jumpButtonSize * 100) + "%", { fontSize: "18px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  button(this, 490, 480, "+", () => { jumpButtonSize = Math.min(1.5, Math.round((jumpButtonSize + 0.15) * 100) / 100); saveData(); this.scene.restart() }, { bg: "#455a64", pad: 15 });
  this.add.text(400, 550, "Recorde: " + highScore + " m  •  Seta Cima / Espaço pula", { fontSize: "14px", color: "#fff" }).setOrigin(0.5);
 }
}

  this.add.text(400, 55, "💰 Suas Moedas: " + totalCoins, { fontSize: "18px", color: "#ffd700", fontStyle: "bold" }).setOrigin(0.5);

  let startY = 95;

   if (unlocked[v.id]) {
    if (selectedVehicle === v.id) {
     this.add.text(x - 50, y + 22, "Equipado", { fontSize: "14px", color: "#4caf50", fontStyle: "bold" });
    } else {
