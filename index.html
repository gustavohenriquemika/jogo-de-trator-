<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo do Trator Infinito</title>
<script src="https://jsdelivr.net"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}
canvas{display:block;margin:auto}
</style>
</head>
<body>
<script>
const VEHICLES = [
 {id:"green",name:"Trator Verde",kind:"tractor",color:0x2e8b3c,price:0},
 {id:"red",name:"Trator Vermelho",kind:"tractor",color:0xd62828,price:50},
 {id:"blue",name:"Trator Azul",kind:"tractor",color:0x1976d2,price:100},
 {id:"yellow",name:"Trator Amarelo",kind:"tractor",color:0xf5b700,price:150},
 {id:"orange",name:"Trator Laranja",kind:"tractor",color:0xf07818,price:200},
 {id:"purple",name:"Trator Roxo",kind:"tractor",color:0x8e44ad,price:250},
 {id:"motoRed",name:"Moto Cross Vermelha",kind:"moto",color:0xe53935,price:300},
 {id:"motoBlue",name:"Moto Cross Azul",kind:"moto",color:0x2196f3,price:350},
 {id:"motoGreen",name:"Moto Cross Verde",kind:"moto",color:0x43a047,price:400},
 {id:"motoYellow",name:"Moto Cross Amarela",kind:"moto",color:0xffc107,price:450},
 {id:"motoBlack",name:"Moto Cross Preta",kind:"moto",color:0x303030,price:500},
 {id:"motoPurple",name:"Moto Cross Roxa",kind:"moto",color:0x9c27b0,price:550}
];

let totalCoins = Number(localStorage.getItem("tratorCoins") || 0);
let highScore = Number(localStorage.getItem("tratorRecord") || 0);
let selectedVehicle = localStorage.getItem("vehicleSelected") || "green";
let jumpButtonSize = Number(localStorage.getItem("tratorJumpSize") || 1);
let unlocked = JSON.parse(localStorage.getItem("vehiclesUnlocked") || '{"green":true}');

VEHICLES.forEach(v => { if (v.price === 0) unlocked[v.id] = true; });

let tractor, trailer, groundPieces, obstacles, overheadObstacles, coinsGroup, sceneryGroup;
let score = 0, coins = 0, lives = 3, gameSpeed = 230, gameOver = false, paused = false, jumpsUsed = 0;
let lastGroundX = 0, lastGroundY = 500, lastObstacleX = 0, lastOverheadX = 1200, currentBiome = -1;
let scoreText, coinsText, livesText, speedText, jumpButton, biomeText, pauseLayer, pauseBtn;
let audioCtx = null;
const MAX_JUMPS = 2;

function saveData() {
 localStorage.setItem("tratorCoins", totalCoins);
 localStorage.setItem("tratorRecord", highScore);
 localStorage.setItem("vehicleSelected", selectedVehicle);
 localStorage.setItem("vehiclesUnlocked", JSON.stringify(unlocked));
 localStorage.setItem("tratorJumpSize", jumpButtonSize);
}

function startAudio() {
 try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
}

function sound(type) {
 try {
  startAudio();
  let o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = ({ coin: 800, jump: 420, hit: 100, buy: 650, break: 180 }[type] || 300);
  o.type = "square";
  g.gain.setValueAtTime(.06, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .13);
  o.start(); o.stop(audioCtx.currentTime + .13);
 } catch (e) {}
}

function drawTexture(scene, key, w, h, fn) {
 let g = scene.make.graphics({ x: 0, y: 0, add: false });
 fn(g); g.generateTexture(key, w, h); g.destroy();
}

function createTextures(scene) {
 VEHICLES.forEach(v => drawTexture(scene, "vehicle_" + v.id, 160, 115, g => {
  if (v.kind === "tractor") {
   g.fillStyle(v.color); g.fillRoundedRect(25, 30, 102, 42, 7); g.fillRoundedRect(83, 14, 52, 35, 6);
   g.fillStyle(0x333333); g.fillRect(43, 2, 48, 40); g.fillStyle(0x9ddcff); g.fillRect(49, 8, 36, 27);
   g.fillStyle(0xffffa0); g.fillCircle(139, 35, 6); g.fillStyle(0x555555); g.fillRect(110, 0, 8, 25);
   g.fillStyle(0x171717); g.fillCircle(39, 80, 27); g.fillCircle(119, 78, 19);
   g.fillStyle(0x888888); g.fillCircle(39, 80, 13); g.fillCircle(119, 78, 9);
  } else {
   g.lineStyle(7, 0x252525); g.strokeCircle(35, 83, 24); g.strokeCircle(122, 83, 24);
   g.fillStyle(0x777777); g.fillCircle(35, 83, 10); g.fillCircle(122, 83, 10);
   g.lineStyle(7, v.color); g.lineBetween(35, 83, 66, 49); g.lineBetween(66, 49, 91, 82); g.lineBetween(91, 82, 35, 83);
   g.lineBetween(66, 49, 105, 47); g.lineBetween(105, 47, 122, 83); g.lineBetween(66, 49, 57, 29);
   g.lineStyle(5, 0x222222); g.lineBetween(48, 27, 72, 27); g.lineBetween(105, 47, 124, 37);
   g.fillStyle(v.color); g.fillRoundedRect(58, 31, 43, 19, 5); g.fillRoundedRect(80, 23, 21, 11, 4);
   g.fillStyle(0x222222); g.fillCircle(71, 17, 10); g.fillStyle(0xeeeeee); g.fillCircle(71, 17, 5);
   g.fillStyle(0xfff3a0); g.fillCircle(132, 39, 5);
  }
 }));
 drawTexture(scene, "trailer", 120, 80, g => {
  g.fillStyle(0x7c211c); g.fillRect(10, 20, 100, 35);
  g.fillStyle(0x555555); g.fillRect(100, 43, 20, 6);
  g.fillStyle(0x171717); g.fillCircle(35, 60, 20); g.fillCircle(85, 60, 20);
  g.fillStyle(0x888888); g.fillCircle(35, 60, 9); g.fillCircle(85, 60, 9);
  g.fillStyle(0xd8a83e); g.fillCircle(60, 12, 10);
 });
 drawTexture(scene, "ground", 120, 120, g => {
  g.fillStyle(0x80502b); g.fillRect(0, 0, 120, 120);
  g.fillStyle(0x3d8b32); g.fillRect(0, 0, 120, 15);
 });
 drawTexture(scene, "rock", 50, 50, g => { g.fillStyle(0x777777); g.fillCircle(25, 25, 24); g.fillStyle(0x999999); g.fillCircle(18, 16, 7); });
 drawTexture(scene, "hay", 64, 48, g => { g.fillStyle(0xd8a83e); g.fillRoundedRect(2, 4, 60, 42, 8); g.lineStyle(3, 0x9a6c25); g.strokeRoundedRect(2, 4, 60, 42, 8); });
 drawTexture(scene, "bighay", 110, 90, g => { g.fillStyle(0xbf9030); g.fillRoundedRect(4, 4, 102, 82, 12); g.lineStyle(5, 0x7c5314); g.strokeRoundedRect(4, 4, 102, 82, 12); });
 drawTexture(scene, "branch", 110, 28, g => { g.lineStyle(13, 0x6d4527); g.lineBetween(5, 14, 105, 14); g.lineStyle(7, 0x4d7e2a); g.lineBetween(32, 12, 20, 2); g.lineBetween(65, 13, 80, 1); });
 drawTexture(scene, "coin", 30, 30, g => { g.fillStyle(0xffd700); g.fillCircle(15, 15, 13); g.lineStyle(3, 0xfff59d); g.strokeCircle(15, 15, 9); });
 drawTexture(scene, "fence", 100, 55, g => { g.fillStyle(0xe6d2a4); g.fillRect(5, 8, 8, 44); g.fillRect(87, 8, 8, 44); g.fillRect(5, 15, 90, 7); g.fillRect(5, 35, 90, 7); });
 drawTexture(scene, "tree", 80, 120, g => { g.fillStyle(0x79502b); g.fillRect(32, 55, 17,65); g.fillStyle(0x2f873c); g.fillCircle(40, 40, 34); });
 drawTexture(scene, "barn", 150, 120, g => { g.fillStyle(0xb8332c); g.fillRect(15, 45, 120, 75); g.fillStyle(0x7c211c); g.fillPoints([{x:5,y:48},{x:75,y:2},{x:145,y:48}],true); });
 drawTexture(scene, "crop", 45, 90, g => { g.lineStyle(5, 0x3c7d2b); g.lineBetween(22, 90, 22, 20); g.fillStyle(0x3d963a); g.fillEllipse(12, 38, 24, 12); });
}

function button(scene, x, y, label, fn, style = {}) {
 let t = scene.add.text(x, y, label, {
  fontSize: style.size || "22px",
  fontStyle: "bold",
  backgroundColor: style.bg || "#249b45",
  padding: { left: style.pad || 15, right: style.pad || 15, top: 9, bottom: 9 },
  color: "#fff",
  align: "center"
 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
 t.on("pointerdown", (pointer, localX, localY, event) => {
  if(event) event.stopPropagation();
  fn();
 });
 return t;
}

class MenuScene extends Phaser.Scene {
 constructor() { super("MenuScene") }
 create() {
  createTextures(this); this.cameras.main.setBackgroundColor("#78c9f2"); this.add.rectangle(400, 470, 800, 260, 0x69a83b);
  this.add.text(400, 50, "🚜 TRATOR INFINITO 2.0", { fontSize: "29px", fontStyle: "bold", color: "#fff", stroke: "#333", strokeThickness: 5 }).setOrigin(0.5);
  this.add.image(400, 155, "vehicle_" + selectedVehicle).setScale(0.9);
  this.add.text(400, 230, "Veículo: " + (VEHICLES.find(v => v.id === selectedVehicle)?.name || ""), { fontSize: "18px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  this.add.text(400, 263, "💰 " + totalCoins + " moedas", { fontSize: "21px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  
  button(this, 400, 320, "▶ JOGAR", () => { startAudio(); this.scene.start("GameScene") }, { size: "26px" });
  button(this, 400, 385, "🚜 GARAGEM", () => this.scene.start("ShopScene"), { size: "18px", bg: "#80512b" });
  
  this.add.text(400, 445, "Tamanho do botão de pulo", { fontSize: "15px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  button(this, 310, 480, "−", () => { jumpButtonSize = Math.max(0.7, Math.round((jumpButtonSize - 0.15) * 100) / 100); saveData(); this.scene.restart() }, { bg: "#455a64", pad: 15 });
  this.add.text(400, 480, Math.round(jumpButtonSize * 100) + "%", { fontSize: "18px", color: "#fff", fontStyle: "bold" }).setOrigin(0.5);
  button(this, 490, 480, "+", () => { jumpButtonSize = Math.min(1.5, Math.round((jumpButtonSize + 0.15) * 100) / 100); saveData(); this.scene.restart() }, { bg: "#455a64", pad: 15 });
  this.add.text(400, 550, "Recorde: " + highScore + " m  •  Seta Cima / Espaço pula", { fontSize: "14px", color: "#fff" }).setOrigin(0.5);
 }
}

class ShopScene extends Phaser.Scene {
 constructor() { super("ShopScene") }
 create() {
  this.cameras.main.setBackgroundColor("#263238");
  this.add.text(400, 25, "GARAGEM DE VEÍCULOS", { fontSize: "24px", fontStyle: "bold", color: "#fff" }).setOrigin(0.5);
  this.add.text(400, 55, "💰 Suas Moedas: " + totalCoins, { fontSize: "18px", color: "#ffd700", fontStyle: "bold" }).setOrigin(0.5);

  let startY = 95;
  VEHICLES.forEach((v, index) => {
   let row = Math.floor(index / 2); let col = index % 2;
   let x = col === 0 ? 210 : 590; let y = startY + (row * 74);
   this.add.image(x - 110, y + 20, "vehicle_" + v.id).setScale(0.4);
   this.add.text(x - 50, y, v.name, { fontSize: "14px", color: "#fff", fontStyle: "bold" });

   if (unlocked[v.id]) {
    if (selectedVehicle === v.id) {
     this.add.text(x - 50, y + 22, "Equipado", { fontSize: "14px", color: "#4caf50", fontStyle: "bold" });
    } else {
button(this, x, y + 30, "EQUIPAR", () => { selectedVehicle = v.id; saveData(); this.scene.restart(); }, { size: "12px", bg: "#1976d2", pad: 8 });
}
} else {
button(this, x, y + 30, COMPRAR 💰${v.price}, () => {
if (totalCoins >= v.price) { totalCoins -= v.price; unlocked[v.id] = true; selectedVehicle = v.id; sound("buy"); saveData(); this.scene.restart(); } else { alert("Moedas insuficientes!"); }
}, { size: "12px", bg: "#d32f2f", pad: 8 });
}
});
button(this, 400, 560, "⬅ VOLTAR AO MENU", () => this.scene.start("MenuScene"), { bg: "#555", size: "16px" });
}
}
class GameScene extends Phaser.Scene {
constructor() { super("GameScene"); }
create() {
score = 0; coins = 0; lives = 3; gameSpeed = 230; gameOver = false; paused = false; jumpsUsed = 0;
lastGroundX = 0; lastGroundY = 460; lastObstacleX = 600; lastOverheadX = 1200; currentBiome = -1;
sceneryGroup = [];
this.cameras.main.setBackgroundColor("#78c9f2");
groundPieces = this.physics.add.group();
obstacles = this.physics.add.group();
overheadObstacles = this.physics.add.group();
coinsGroup = this.physics.add.group();
for (let i = 0; i < 10; i++) { this.spawnGround(); }
let vInfo = VEHICLES.find(v => v.id === selectedVehicle) || VEHICLES[0];
tractor = this.physics.add.sprite(220, 300, "vehicle_" + vInfo.id);
tractor.setGravityY(1100).setBodySize(110, 85).setOffset(25, 15).setDepth(2);
trailer = this.physics.add.sprite(110, 300, "trailer");
trailer.setGravityY(1100).setBodySize(95, 60).setOffset(10, 10).setDepth(1);
this.physics.add.collider(tractor, groundPieces, () => { if (!gameOver) jumpsUsed = 0; });
this.physics.add.collider(trailer, groundPieces);
this.physics.add.collider(obstacles, groundPieces);
this.physics.add.overlap(tractor, coinsGroup, this.collectCoin, null, this);
this.physics.add.overlap(trailer, coinsGroup, this.collectCoin, null, this);
this.physics.add.overlap(tractor, obstacles, this.hitObstacle, null, this);
this.physics.add.overlap(tractor, overheadObstacles, this.hitObstacle, null, this);
scoreText = this.add.text(20, 20, "Distância: 0 m", { fontSize: "20px", color: "#000", fontStyle: "bold" });
coinsText = this.add.text(20, 50, "Moedas: 0", { fontSize: "20px", color: "#d8a83e", fontStyle: "bold" });
livesText = this.add.text(20, 80, "❤️ Vidas: 3", { fontSize: "20px", color: "#b8332c", fontStyle: "bold" });
speedText = this.add.text(20, 110, "Velocidade: 100%", { fontSize: "15px", color: "#555", fontStyle: "bold" });
biomeText = this.add.text(400, 25, "Bioma: Fazenda Padrão", { fontSize: "18px", color: "#fff", fontStyle: "bold", backgroundColor: "#00000055", padding: 5 }).setOrigin(0.5);
let bSize = jumpButtonSize;
jumpButton = this.add.rectangle(710, 510, 120 * bSize, 120 * bSize, 0xffffff, 0.4).setInteractive({ useHandCursor: true }).on("pointerdown", () => this.handleJump());
this.add.text(710, 510, "PULAR", { fontSize: Math.round(16 * bSize) + "px", fontStyle: "bold", color: "#000" }).setOrigin(0.5);
pauseBtn = button(this, 750, 35, "⏸", () => this.togglePause(), { bg: "#607d8b", pad: 10 });
this.input.keyboard.on("keydown-SPACE", () => this.handleJump());
this.input.keyboard.on("keydown-UP", () => this.handleJump());
pauseLayer = this.add.container(0, 0).setVisible(false).setDepth(10);
let bg = this.add.rectangle(400, 300, 800, 600, 0x000000, 0.6).setInteractive();
let pText = this.add.text(400, 220, "JOGO PAUSADO", { fontSize: "34px", fontStyle: "bold", color: "#fff" }).setOrigin(0.5);
let btnResume = button(this, 400, 300, "CONTINUAR", () => this.togglePause(), { size: "20px" });
let btnMenu = button(this, 400, 370, "MENU PRINCIPAL", () => { this.togglePause(); this.scene.start("MenuScene"); }, { size: "18px", bg: "#555" });
pauseLayer.add([bg, pText, btnResume, btnMenu]);
}
update(time, delta) {
if (gameOver || paused) return;
score += (delta / 1000) * (gameSpeed / 150);
scoreText.setText("Distância: " + Math.floor(score) + " m");
if (Math.floor(score) % 150 === 0 && Math.floor(score) > 0) {
gameSpeed = Math.min(500, 230 + Math.floor(score / 150) * 15);
speedText.setText("Velocidade: " + Math.round((gameSpeed / 230) * 100) + "%");
}
let biomeId = Math.floor(score / 300) % 4;
if (biomeId !== currentBiome) { currentBiome = biomeId; this.changeBiome(currentBiome); }
let tDist = tractor.x - 110 - trailer.x;
trailer.setVelocityX(tDist * 5);
if (Math.abs(tractor.y - trailer.y) > 80 && tractor.body.touching.down) {
trailer.y = tractor.y;
}
groundPieces.children.each(g => {
g.x -= (gameSpeed * delta) / 1000;
g.body.updateFromGameObject();
if (g.x < -100) { groundPieces.remove(g, true, true); }
});
if (lastGroundX < 900) { this.spawnGround(); }
sceneryGroup.forEach((s, idx) => {
s.x -= (gameSpeed * 0.4 * delta) / 1000;
if (s.x < -200) { s.destroy(); sceneryGroup.splice(idx, 1); }
});
if (Phaser.Math.Between(0, 100) < 2) { this.spawnScenery(); }
obstacles.children.each(o => {
o.x -= (gameSpeed * delta) / 1000;
if (o.x < -150) { obstacles.remove(o, true, true); }
});
overheadObstacles.children.each(o => {
o.x -= (gameSpeed * delta) / 1000;
if (o.x < -100) { overheadObstacles.remove(o, true, true); }
});
coinsGroup.children.each(c => {
c.x -= (gameSpeed * delta) / 1000;
if (c.x < -100) { coinsGroup.remove(c, true, true); }
});
if (time > lastObstacleX) {
this.spawnObstacle();
lastObstacleX = time + Phaser.Math.Between(1500, 3000) - (gameSpeed * 1.2);
}
if (time > lastOverheadX && currentBiome === 1) {
this.spawnOverheadObstacle();
lastOverheadX = time + Phaser.Math.Between(2500, 4500);
}
if (tractor.y > 650 || trailer.y > 650) { this.triggerGameOver(); }
}
handleJump() {
if (gameOver || paused) return;
if (jumpsUsed < MAX_JUMPS) { tractor.setVelocityY(-430); jumpsUsed++; sound("jump"); }
}
togglePause() {
if (gameOver) return;
paused = !paused;
if (paused) { this.physics.pause(); pauseLayer.setVisible(true); }
else { this.physics.resume(); pauseLayer.setVisible(false); }
}
changeBiome(id) {
let names = ["Fazenda Padrão", "Floresta de Árvores", "Plantação de Milho", "Cercados e Celeiros"];
let colors = ["#78c9f2", "#5c9bc0", "#4fa885", "#70b560"];
biomeText.setText("Bioma: " + names[id]);
this.cameras.main.setBackgroundColor(colors[id]);
}
spawnGround() {
let nextY = lastGroundY;
if (Phaser.Math.Between(0, 10) < 4) {
let change = Phaser.Math.Between(-25, 25);
nextY = Phaser.Math.Clamp(lastGroundY + change, 400, 530);
}
let g = groundPieces.create(lastGroundX + 60, nextY + 60, "ground");
g.body.setAllowGravity(false).setImmovable(true);
lastGroundX = g.x + 60;
lastGroundY = nextY;
}
spawnScenery() {
let types = ["tree", "barn", "crop", "fence"];
let weights =;
if (currentBiome === 0) weights =;
if (currentBiome === 1) weights =;
if (currentBiome === 2) weights =;
if (currentBiome === 3) weights =;
let type = types[Phaser.Math.RND.pick(weights)];
let asset = this.add.image(850, lastGroundY + 15, type).setOrigin(0.5, 1).setDepth(-1);
sceneryGroup.push(asset);
}
spawnObstacle() {
let obsTypes = ["rock", "hay", "bighay"];
let type = Phaser.Math.RND.pick(obsTypes);
let hOffset = type === "bighay" ? 45 : 25;
let obs = obstacles.create(850, lastGroundY + 15 - hOffset, type);
if (obs) {
obs.body.setAllowGravity(false).setImmovable(true);
obs.typeKey = type;
if (Phaser.Math.Between(0, 10) < 6) { this.spawnCoinsAbove(850, lastGroundY - 80); }
}
}
spawnOverheadObstacle() {
let obs = overheadObstacles.create(850, Phaser.Math.Between(220, 300), "branch");
if (obs) { obs.body.setAllowGravity(false).setImmovable(true); }
}
spawnCoinsAbove(x, y) {
let count = Phaser.Math.Between(2, 4);
for (let i = 0; i < count; i++) {
let c = coinsGroup.create(x + (i * 35), y, "coin");
c.body.setAllowGravity(false);
}
}
collectCoin(v, coin) {
coinsGroup.remove(coin, true, true); coins++; totalCoins++; sound("coin");
coinsText.setText("Moedas: " + coins); saveData();
}
hitObstacle(player, obstacle) {
if (obstacle.typeKey === "bighay") {
obstacles.remove(obstacle, true, true);
sound("break");
score += 10;
this.cameras.main.shake(150, 0.01);
return;
}
if (obstacle.hasHit) return;
obstacle.hasHit = true;
lives--; sound("hit"); livesText.setText("❤️ Vidas: " + lives);
this.cameras.main.flash(200, 200, 50, 50);
obstacles.remove(obstacle, true, true);
if (lives <= 0) { this.triggerGameOver(); }
}
triggerGameOver() {
gameOver = true; this.physics.pause();
if (score > highScore) { highScore = Math.floor(score); saveData(); }
this.add.rectangle(400, 300, 800, 600, 0x000000, 0.7).setDepth(9);
this.add.text(400, 180, "FIM DE JOGO!", { fontSize: "42px", fontStyle: "bold", color: "#ff3333" }).setOrigin(0.5).setDepth(9);
this.add.text(400, 250, Pontuação: ${Math.floor(score)} m, { fontSize: "24px", color: "#fff" }).setOrigin(0.5).setDepth(9);
this.add.text(400, 290, Moedas coletadas: +${coins}, { fontSize: "20px", color: "#ffd700" }).setOrigin(0.5).setDepth(9);
button(this, 400, 390, "🔄 JOGAR DE NOVO", () => this.scene.restart(), { size: "20px" }).setDepth(9);
button(this, 400, 455, "🏠 MENU PRINCIPAL", () => this.scene.start("MenuScene"), { size: "16px", bg: "#555" }).setDepth(9);
}
}
const config = {
type: Phaser.AUTO,
width: 800,
height: 600,
physics: { default: "arcade", arcade: { gravity: { y: 0 }, debug: false } },
scene: [MenuScene, GameScene, ShopScene]
};
const game = new Phaser.Game(config);
