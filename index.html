<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Trator Infinito</title>
    <!-- CDN alternativo mais rápido e estável para evitar lentidão no carregamento -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#87CEEB', // Define a cor do céu direto na configuração para evitar tela preta inicial
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 600 }, debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let tractor, cursors, groundGroup, obstaclesGroup;
let nextObstacleX = 600;

function preload() {}

function create() {
    groundGroup = this.physics.add.staticGroup();
    obstaclesGroup = this.physics.add.staticGroup();

    // Criação segura das texturas base reutilizáveis (evita criar milhares de texturas dinâmicas)
    // 1. Textura do Chão
    let groundGraphic = this.make.graphics({ x: 0, y: 0, add: false });
    groundGraphic.fillStyle(0x795548, 1); groundGraphic.fillRect(0, 20, 800, 100);
    groundGraphic.fillStyle(0x4caf50, 1); groundGraphic.fillRect(0, 0, 800, 20);
    groundGraphic.generateTexture('ground_base', 800, 120);

    // 2. Textura do Trator
    let tractorTexture = this.make.graphics({ x: 0, y: 0, add: false });
    tractorTexture.fillStyle(0x2e7d32, 1); tractorTexture.fillRect(0, 20, 60, 30);
    tractorTexture.fillStyle(0x1565c0, 1); tractorTexture.fillRect(30, 0, 25, 20);
    tractorTexture.fillStyle(0x111111, 1); tractorTexture.fillCircle(15, 45, 12); tractorTexture.fillCircle(45, 45, 12);
    tractorTexture.generateTexture('tractor_base', 65, 60);

    // 3. Texturas dos Obstáculos
    let rockGraphic = this.make.graphics({ x: 0, y: 0, add: false });
    rockGraphic.fillStyle(0x757575, 1); rockGraphic.fillCircle(15, 15, 15);
    rockGraphic.generateTexture('rock_base', 30, 30);

    let rampGraphic = this.make.graphics({ x: 0, y: 0, add: false });
    rampGraphic.fillStyle(0x8d6e63, 1); rampGraphic.fillTriangle(0, 40, 40, 0, 40, 40); rampGraphic.fillRect(40, 0, 40, 40);
    rampGraphic.generateTexture('ramp_base', 80, 40);

    let riverGraphic = this.make.graphics({ x: 0, y: 0, add: false });
    riverGraphic.fillStyle(0x29b6f6, 1); riverGraphic.fillRect(0, 0, 50, 25);
    riverGraphic.generateTexture('river_base', 50, 25);

    // Inicializa os primeiros blocos de chão estáveis
    for (let i = 0; i < 4; i++) {
        groundGroup.create(i * 800 + 400, 550, 'ground_base').refreshBody();
    }

    // Instancia o trator
    tractor = this.physics.add.sprite(200, 300, 'tractor_base');
    tractor.setCollideWorldBounds(false);
    tractor.setBounce(0.1);

    // Configura colisores rápidos
    this.physics.add.collider(tractor, groundGroup);
    this.physics.add.collider(tractor, obstaclesGroup, hitObstacle, null, this);

    cursors = this.input.keyboard.createCursorKeys();
    this.cameras.main.startFollow(tractor, true, 0.05, 0.05, -200, 100);
}

function update() {
    if (cursors.left.isDown) {
        tractor.setVelocityX(-150);
    } else if (cursors.right.isDown) {
        tractor.setVelocityX(200);
    } else {
        tractor.setVelocityX(0);
    }

    if (cursors.up.isDown && tractor.body.touching.down) {
        tractor.setVelocityY(-320);
    }

    // Geração infinita com base na posição X do trator (Garante performance leve)
    if (tractor.x > nextObstacleX - 800) {
        groundGroup.create(nextObstacleX + 800, 550, 'ground_base').refreshBody();
        generateRandomObstacle(this, nextObstacleX);
        nextObstacleX += Phaser.Math.Between(400, 700);
    }
}

function generateRandomObstacle(scene, x) {
    let type = Phaser.Math.Between(1, 3);
    if (type === 1) {
        obstaclesGroup.create(x, 475, 'rock_base').refreshBody();
    } else if (type === 2) {
        obstaclesGroup.create(x, 470, 'ramp_base').refreshBody();
    } else if (type === 3) {
        obstaclesGroup.create(x, 478, 'river_base').refreshBody();
    }
}

function hitObstacle(tractor, obstacle) {
    if(tractor.body.touching.right) {
        tractor.setVelocityX(0);
    }
}
</script>

</body>
</html>
