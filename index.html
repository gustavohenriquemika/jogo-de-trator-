<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo do Trator Infinito</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        touch-action: none;
    }

    canvas {
        display: block;
        margin: auto;
    }
</style>
</head>

<body>

<script>

/* =========================================================
   DADOS DO JOGO
========================================================= */

let totalCoins = Number(localStorage.getItem("tratorCoins") || 0);
let highScore = Number(localStorage.getItem("tratorRecord") || 0);

let selectedTractor = localStorage.getItem("tratorSelecionado") || "green";

let unlocked = JSON.parse(
    localStorage.getItem("tratoresLiberados") ||
    '{"green":true,"red":false,"blue":false,"yellow":false}'
);

let tractor;
let groundPieces;
let obstacles;
let coinsGroup;

let score = 0;
let coins = 0;
let lives = 3;

let gameSpeed = 230;
let distance = 0;

let scoreText;
let coinsText;
let livesText;
let speedText;

let gameOver = false;
let jumpReady = true;

let lastObstacleX = 1000;
let lastGroundX = 0;

let dayTime = 0;
let rain = false;

let rainParticles;
let nightOverlay;

let audioCtx = null;


/* =========================================================
   CORES DOS TRATORES
========================================================= */

const tractorColors = {
    green: 0x2e8b3c,
    red: 0xd62828,
    blue: 0x1976d2,
    yellow: 0xf5b700
};


/* =========================================================
   SOM
========================================================= */

function startAudio() {

    if (!audioCtx) {
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function sound(type) {

    try {

        startAudio();

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let frequency = 300;

        if (type === "coin") frequency = 800;
        if (type === "jump") frequency = 420;
        if (type === "hit") frequency = 100;
        if (type === "buy") frequency = 650;

        osc.frequency.value = frequency;
        osc.type = "square";

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.15
        );

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);

    } catch(e) {}
}


/* =========================================================
   FUNÇÕES DE SALVAMENTO
========================================================= */

function saveData() {

    localStorage.setItem(
        "tratorCoins",
        totalCoins
    );

    localStorage.setItem(
        "tratorRecord",
        highScore
    );

    localStorage.setItem(
        "tratoresLiberados",
        JSON.stringify(unlocked)
    );

    localStorage.setItem(
        "tratorSelecionado",
        selectedTractor
    );
}


/* =========================================================
   TEXTURAS
========================================================= */

function createTextures(scene) {

    /* TRATOR */

    let g = scene.make.graphics({
        x: 0,
        y: 0,
        add: false
    });

    let color = tractorColors[selectedTractor];

    // Corpo
    g.fillStyle(color);
    g.fillRoundedRect(22, 25, 105, 48, 8);

    // Capô
    g.fillStyle(color);
    g.fillRoundedRect(82, 12, 55, 38, 7);

    // Cabine
    g.fillStyle(0x333333);
    g.fillRect(38, 0, 55, 42);

    // Vidro
    g.fillStyle(0x9ddcff);
    g.fillRect(45, 6, 41, 29);

    // Para-choque
    g.fillStyle(0x444444);
    g.fillRect(126, 42, 22, 8);

    // Farol
    g.fillStyle(0xffff99);
    g.fillCircle(130, 24, 6);

    // Roda traseira
    g.fillStyle(0x171717);
    g.fillCircle(35, 78, 27);

    g.fillStyle(0x777777);
    g.fillCircle(35, 78, 13);

    // Roda dianteira
    g.fillStyle(0x171717);
    g.fillCircle(116, 76, 18);

    g.fillStyle(0x777777);
    g.fillCircle(116, 76, 9);

    // Escapamento
    g.fillStyle(0x555555);
    g.fillRect(105, 0, 7, 25);

    // Fumaça
    g.fillStyle(0xaaaaaa, 0.7);
    g.fillCircle(109, -6, 5);

    g.generateTexture(
        "tractor",
        150,
        110
    );

    g.destroy();


    /* CHÃO */

    g = scene.make.graphics({
        x: 0,
        y: 0,
        add: false
    });

    g.fillStyle(0x7a4a25);
    g.fillRect(0, 0, 500, 70);

    g.fillStyle(0x3d8b32);
    g.fillRect(0, 0, 500, 12);

    g.fillStyle(0x65a93d);

    for (let i = 0; i < 20; i++) {

        g.fillRect(
            Phaser.Math.Between(0, 490),
            Phaser.Math.Between(15, 60),
            3,
            8
        );
    }

    g.generateTexture(
        "ground",
        500,
        70
    );

    g.destroy();


    /* PEDRA */

    g = scene.make.graphics({
        x: 0,
        y: 0,
        add: false
    });

    g.fillStyle(0x777777);
    g.fillCircle(35, 35, 32);

    g.fillStyle(0x999999);
    g.fillCircle(24, 22, 9);

    g.generateTexture(
        "rock",
        70,
        70
    );

    g.destroy();


    /* RAMPA */

    g = scene.make.graphics({
        x: 0,
        y: 0,
        add: false
    });

    g.fillStyle(0x704214);

    g.beginPath();
    g.moveTo(0, 60);
    g.lineTo(120, 60);
    g.lineTo(120, 0);
    g.closePath();
    g.fillPath();

    g.fillStyle(0x3e8f35);
    g.fillRect(0, 54, 120, 7);

    g.generateTexture(
        "ramp",
        120,
        65
    );

    g.destroy();


    /* ÁGUA */

    g = scene.make.graphics({
        x: 0,
        y: 0,
        add: false
    });

    g.fillStyle(0x2879c7);
    g.fillRect(0, 0, 130, 45);

    g.lineStyle(3, 0x7ddfff);

    for (let i = 0; i < 4; i++) {

        g.beginPath();
        g.moveTo(5, 8 + i * 10);
        g.lineTo(120, 8 + i * 10);
        g.strokePath();
    }

    g.generateTexture(
        "water",
        130,
        45
    );

    g.destroy();


    /* MOEDA */

    g = scene.make.graphics({
        x: 0,
        y: 0,
        add: false
    });

    g.fillStyle(0xffd700);
    g.fillCircle(15, 15, 13);

    g.lineStyle(3, 0xfff59d);
    g.strokeCircle(15, 15, 9);

    g.generateTexture(
        "coin",
        30,
        30
    );

    g.destroy();
}

/* =========================================================
   LOJA
========================================================= */

class ShopScene extends Phaser.Scene {

    constructor() {
        super("ShopScene");
    }

    create() {

        createTextures(this);

        this.cameras.main.setBackgroundColor("#263238");

        this.add.text(
            400,
            55,
            "🛒 LOJA DE TRATORES",
            {
                fontSize: "32px",
                color: "#ffffff",
                fontStyle: "bold"
            }
        ).setOrigin(0.5);


        this.add.text(
            400,
            105,
            "💰 " + totalCoins,
            {
                fontSize: "24px",
                color: "#ffd700"
            }
        ).setOrigin(0.5);


        const types = [
            {
                id: "green",
                name: "Verde",
                price: 0
            },
            {
                id: "red",
                name: "Vermelho",
                price: 50
            },
            {
                id: "blue",
                name: "Azul",
                price: 100
            },
            {
                id: "yellow",
                name: "Amarelo",
                price: 200
            }
        ];


        types.forEach(
            (item, index) => {

                let x = 120 + index * 190;

                let color =
                    tractorColors[item.id];

                let box =
                    this.add.rectangle(
                        x,
                        280,
                        160,
                        250,
                        0x37474f
                    );

                let preview =
                    this.add.image(
                        x,
                        205,
                        "tractor"
                    );

                preview.setScale(0.75);


                this.add.text(
                    x,
                    325,
                    item.name,
                    {
                        fontSize: "21px",
                        color: "#ffffff"
                    }
                ).setOrigin(0.5);


                let text;

                if (unlocked[item.id]) {

                    if (selectedTractor === item.id) {

                        text = "✓ USANDO";

                    } else {

                        text = "USAR";
                    }

                } else {

                    text = "💰 " + item.price;
                }


                let button =
                    this.add.text(
                        x,
                        380,
                        text,
                        {
                            fontSize: "17px",
                            backgroundColor:
                                selectedTractor === item.id
                                    ? "#388e3c"
                                    : "#546e7a",
                            padding: 9,
                            color: "#ffffff"
                        }
                    ).setOrigin(0.5);


                button.setInteractive({
                    useHandCursor: true
                });


                button.on(
                    "pointerdown",
                    () => {

                        startAudio();

                        if (!unlocked[item.id]) {

                            if (
                                totalCoins >= item.price
                            ) {

                                totalCoins -=
                                    item.price;

                                unlocked[item.id] =
                                    true;

                                selectedTractor =
                                    item.id;

                                sound("buy");

                                saveData();

                                this.scene.restart();

                            }

                        } else {

                            selectedTractor =
                                item.id;

                            saveData();

                            sound("buy");

                            this.scene.restart();
                        }
                    }
                );
            }
        );


        let back =
            this.add.text(
                400,
                540,
                "← VOLTAR",
                {
                    fontSize: "23px",
                    backgroundColor: "#455a64",
                    padding: 12,
                    color: "#ffffff"
                }
            ).setOrigin(0.5);


        back.setInteractive({
            useHandCursor: true
        });

        back.on(
            "pointerdown",
            () => {

                this.scene.start(
                    "MenuScene"
                );
            }
        );
    }
}


/* =========================================================
   JOGO
========================================================= */

class GameScene extends Phaser.Scene {

    constructor() {
        super("GameScene");
    }

    create() {

        createTextures(this);

        score = 0;
        coins = 0;
        lives = 3;

        gameSpeed = 230;
        distance = 0;

        gameOver = false;

        lastObstacleX = 1000;
        lastGroundX = 0;

        dayTime = 0;

        /* Fundo */

        this.cameras.main.setBackgroundColor(
            "#7bc8f6"
        );


        /* Sol */

        this.sun = this.add.circle(
            680,
            90,
            48,
            0xffdf4d
        );

        this.sun.setScrollFactor(0);


        /* Lua */

        this.moon = this.add.circle(
            680,
            90,
            40,
            0xf5f5dc
        );

        this.moon.setScrollFactor(0);
        this.moon.setVisible(false);


        /* Grupos */

        groundPieces =
            this.physics.add.staticGroup();

        obstacles =
            this.physics.add.staticGroup();

        coinsGroup =
            this.physics.add.group({
                allowGravity: false
            });


        /* Trator */

        tractor =
            this.physics.add.sprite(
                180,
                350,
                "tractor"
            );

        tractor.setScale(0.72);

        tractor.setCollideWorldBounds(false);

        tractor.body.setSize(
            125,
            70
        );

        tractor.body.setOffset(
            10,
            30
        );


        /* Mundo */

        this.cameras.main.startFollow(
            tractor,
            true,
            0.08,
            0.08
        );

        this.cameras.main.setBounds(
            0,
            0,
            1000000,
            600
        );


        /* Chão inicial */

        for (
            let x = 0;
            x < 3000;
            x += 500
        ) {

            addGround(this, x);

        }


        /* Obstáculos iniciais */

        for (
            let x = 900;
            x < 2800;
            x += Phaser.Math.Between(
                450,
                700
            )
        ) {

            createObstacle(
                this,
                x
            );
        }


        /* Colisão */

        this.physics.add.collider(
            tractor,
            groundPieces
        );

        this.physics.add.collider(
            tractor,
            obstacles,
            hitObstacle,
            null,
            this
        );


        this.physics.add.overlap(
            tractor,
            coinsGroup,
            collectCoin,
            null,
            this
        );


        /* HUD */

        scoreText =
            this.add.text(
                20,
                20,
                "📏 0 m",
                {
                    fontSize: "22px",
                    color: "#ffffff",
                    stroke: "#000000",
                    strokeThickness: 4
                }
            );

        coinsText =
            this.add.text(
                20,
                50,
                "💰 0",
                {
                    fontSize: "22px",
                    color: "#ffffff",
                    stroke: "#000000",
                    strokeThickness: 4
                }
            );

        livesText =
            this.add.text(
                20,
                80,
                "❤️❤️❤️",
                {
                    fontSize: "22px",
                    stroke: "#000000",
                    strokeThickness: 4
                }
            );

        speedText =
            this.add.text(
                20,
                110,
                "🚜 Velocidade: 1x",
                {
                    fontSize: "18px",
                    color: "#ffffff",
                    stroke: "#000000",
                    strokeThickness: 3
                }
            );


        [
            scoreText,
            coinsText,
            livesText,
            speedText
        ].forEach(
            t => t.setScrollFactor(0)
        );


        /* Botão mobile */

        let jumpButton =
            this.add.text(
                700,
                500,
                "⬆\nPULAR",
                {
                    fontSize: "23px",
                    align: "center",
                    backgroundColor:
                        "#ffffff88",
                    padding: 12,
                    color: "#000000"
                }
            ).setOrigin(0.5);

        jumpButton.setScrollFactor(0);

        jumpButton.setInteractive();

        jumpButton.on(
            "pointerdown",
            () => {
                jump.call(this);
            }
        );


        /* Teclado */

        this.input.keyboard.on(
            "keydown-UP",
            () => jump.call(this)
        );

        this.input.keyboard.on(
            "keydown-SPACE",
            () => jump.call(this)
        );


        /* Toque na tela */

        this.input.on(
            "pointerdown",
            (pointer) => {

                if (
                    pointer.x >
                    this.scale.width * 0.55
                ) {
                    jump.call(this);
                }
            }
        );


        /* Chuva */

        rainParticles =
            this.add.particles(
                0,
                0,
                "coin",
                {
                    lifespan: 700,
                    speedY: {
                        min: 400,
                        max: 700
                    },
                    speedX: {
                        min: -40,
                        max: 40
                    },
                    scale: 0.12,
                    quantity: 0,
                    frequency: 80
                }
            );

        rainParticles.setScrollFactor(0);


        /* Atualização */

        this.time.addEvent({
            delay: 15000,
            loop: true,
            callback: () => {

                rain =
                    !rain;

                if (rain) {

                    rainParticles.quantity =
                        5;

                    this.cameras.main.setBackgroundColor(
                        "#647b88"
                    );

                } else {

                    rainParticles.quantity =
                        0;

                }
            }
        });
    }


    update(time, delta) {

        if (gameOver) return;


        /* Velocidade aumentando */

        gameSpeed +=
            delta * 0.004;

        tractor.setVelocityX(
            gameSpeed
        );


        /* Distância */

        distance =
            Math.floor(
                tractor.x / 10
            );

        score = distance;


        if (
            score >
            highScore
        ) {

            highScore =
                score;

            saveData();
        }


        scoreText.setText(
            "📏 " + score + " m"
        );

        coinsText.setText(
            "💰 " + coins
        );


        let hearts = "";

        for (
            let i = 0;
            i < lives;
            i++
        ) {
            hearts += "❤️";
        }

        livesText.setText(
            hearts
        );


        speedText.setText(
            "🚜 Velocidade: " +
            (gameSpeed / 230)
                .toFixed(1) +
            "x"
        );


        /* Cria chão infinitamente */

        if (
            tractor.x >
            lastGroundX - 1800
        ) {

            for (
                let i = 0;
                i < 5;
                i++
            ) {

                addGround(
                    this,
                    lastGroundX
                );
            }
        }


        /* Cria obstáculos infinitamente */

        if (
            tractor.x >
            lastObstacleX - 1600
        ) {

            createObstacle(
                this,
                lastObstacleX +
                Phaser.Math.Between(
                    400,
                    650
                )
            );
        }


        /* Ciclo dia/noite */

        dayTime +=
            delta * 0.00003;

        let cycle =
            Math.sin(dayTime);


        if (cycle < -0.2) {

            this.cameras.main.setBackgroundColor(
                "#17233b"
            );

            this.sun.setVisible(false);
            this.moon.setVisible(true);

        } else {

            if (!rain) {

                this.cameras.main.setBackgroundColor(
                    "#7bc8f6"
                );
            }

            this.sun.setVisible(true);
            this.moon.setVisible(false);
        }


        /* Se caiu */

        if (
            tractor.y > 650
        ) {

            loseLife.call(this);
        }
    }
}


/* =========================================================
   CHÃO INFINITO
========================================================= */

function addGround(scene, x) {

    let ground =
        groundPieces.create(
            x + 250,
            565,
            "ground"
        );

    ground.setOrigin(
        0.5,
        0.5
    );

    ground.refreshBody();

    lastGroundX =
        x + 500;
}


/* =========================================================
   OBSTÁCULOS
========================================================= */

function createObstacle(scene, x) {

    let types = [
        "rock",
        "ramp",
        "water"
    ];

    let type =
        Phaser.Utils.Array.GetRandom(
            types
        );


    let obstacle;


    if (type === "rock") {

        obstacle =
            obstacles.create(
                x,
                515,
                "rock"
            );

        obstacle.setScale(
            Phaser.Math.FloatBetween(
                0.7,
                1.2
            )
        );

    }


    if (type === "ramp") {

        obstacle =
            obstacles.create(
                x,
                530,
                "ramp"
            );

    }


    if (type === "water") {

        obstacle =
            obstacles.create(
                x,
                540,
                "water"
            );
    }


    obstacle.refreshBody();


    /* Moedas */

    let amount =
        Phaser.Math.Between(
            1,
            4
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        let coin =
            coinsGroup.create(
                x +
                i * 40,
                430 -
                Math.abs(
                    i - amount / 2
                ) * 15,
                "coin"
            );

        coin.body.allowGravity =
            false;
    }


    lastObstacleX = x;
}


/* =========================================================
   PEGAR MOEDA
========================================================= */

function collectCoin(
    tractor,
    coin
) {

    coin.destroy();

    coins++;

    totalCoins++;

    saveData();

    sound("coin");
}


/* =========================================================
   PULAR
========================================================= */

function jump() {

    if (gameOver) return;

    if (
        tractor.body.blocked.down ||
        tractor.body.touching.down
    ) {

        tractor.setVelocityY(
            -430
        );

        sound("jump");
    }
}


/* =========================================================
   BATER
========================================================= */

function hitObstacle(
    tractor,
    obstacle
) {

    if (gameOver) return;

    loseLife.call(this);
}


/* =========================================================
   PERDER VIDA
========================================================= */

function loseLife() {

    if (gameOver) return;

    lives--;

    sound("hit");

    tractor.setTint(
        0xff5555
    );

    this.time.delayedCall(
        300,
        () => {

            if (tractor) {

                tractor.clearTint();
            }
        }
    );


    if (lives <= 0) {

        endGame.call(this);

    } else {

        tractor.setPosition(
            tractor.x + 80,
            350
        );

        tractor.setVelocity(
            0,
            -250
        );
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    gameOver = true;

    tractor.setVelocity(
        0,
        0
    );


    saveData();


    let box =
        this.add.rectangle(
            400,
            300,
            600,
            350,
            0x000000,
            0.82
        );

    box.setScrollFactor(0);


    let title =
        this.add.text(
            400,
            190,
            "💥 FIM DE JOGO",
            {
                fontSize: "40px",
                color: "#ff5555",
                fontStyle: "bold"
            }
        ).setOrigin(0.5);

    title.setScrollFactor(0);


    let stats =
        this.add.text(
            400,
            270,
            "Você percorreu " +
            score +
            " metros!\n\n" +
            "💰 Moedas: " +
            coins +
            "\n" +
            "🏆 Recorde: " +
            highScore,
            {
                fontSize: "23px",
                align: "center",
                color: "#ffffff"
            }
        ).setOrigin(0.5);

    stats.setScrollFactor(0);


    let button =
        this.add.text(
            400,
            405,
            "🏠 VOLTAR AO MENU",
            {
                fontSize: "22px",
                backgroundColor: "#249b45",
                padding: 14,
                color: "#ffffff"
            }
        ).setOrigin(0.5);

    button.setScrollFactor(0);

    button.setInteractive({
        useHandCursor: true
    });


    button.on(
        "pointerdown",
        () => {

            this.scene.start(
                "MenuScene"
            );
        }
    );
}


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const config = {

    type: Phaser.AUTO,

    width: 800,

    height: 600,

    backgroundColor: "#7bc8f6",

    physics: {

        default: "arcade",

        arcade: {

            gravity: {
                y: 1000
            },

            debug: false
        }
    },

    scale: {

        mode: Phaser.Scale.FIT,

        autoCenter:
            Phaser.Scale.CENTER_BOTH
    },

    scene: [
        MenuScene,
        ShopScene,
        GameScene
    ]
};


/* =========================================================
   INICIAR
========================================================= */

window.onload = function() {

    new Phaser.Game(
        config
    );
};

</script>
