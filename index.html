
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo do Trator Infinito</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #18251a;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
#game {
  width: 100%;
  max-width: 1000px;
  margin: auto;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: manipulation;
}
</style>
</head>
<body>
<div id="game"></div>

<script>
const W = 800;
const H = 600;

const save = {
  get(key, fallback) {
    try {
      const value = localStorage.getItem("trator_" + key);
      return value === null ? fallback : JSON.parse(value);
    } catch (e) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem("trator_" + key, JSON.stringify(value));
    } catch (e) {}
  }
};

const vehicles = [
  { name: "Trator Verde", type: "tractor", color: 0x39a845, price: 0 },
  { name: "Trator Vermelho", type: "tractor", color: 0xd83932, price: 100 },
  { name: "Trator Azul", type: "tractor", color: 0x2584d8, price: 180 },
  { name: "Trator Amarelo", type: "tractor", color: 0xf0bd28, price: 250 },
  { name: "Trator Rural", type: "tractor", color: 0x8b6741, price: 350 },
  { name: "Trator Turbo", type: "tractor", color: 0x9a42d1, price: 500 },
  { name: "Moto Verde", type: "moto", color: 0x30b95c, price: 150 },
  { name: "Moto Vermelha", type: "moto", color: 0xe83c3c, price: 220 },
  { name: "Moto Azul", type: "moto", color: 0x238de2, price: 300 },
  { name: "Moto Laranja", type: "moto", color: 0xff851b, price: 400 },
  { name: "Moto Roxa", type: "moto", color: 0xa04bdb, price: 550 },
  { name: "Moto Especial", type: "moto", color: 0xffffff, price: 750 }
];

let coins = save.get("coins", 0);
let unlocked = save.get("unlocked", [0]);
let selected = save.get("selected", 0);
let record = save.get("record", 0);

function saveProgress() {
  save.set("coins", coins);
  save.set("unlocked", unlocked);
  save.set("selected", selected);
  save.set("record", record);
}

function addText(scene, x, y, text, size = 24, color = "#ffffff") {
  return scene.add.text(x, y, text, {
    fontFamily: "Arial",
    fontSize: size + "px",
    color,
    fontStyle: "bold",
    stroke: "#18251a",
    strokeThickness: 3
  }).setOrigin(0.5);
}

function makeButton(scene, x, y, label, callback, width = 220) {
  const bg = scene.add.rectangle(x, y, width, 48, 0x2f8d43)
    .setStrokeStyle(3, 0xc5e8a5)
    .setInteractive({ useHandCursor: true });

  const text = addText(scene, x, y, label, 20);

  bg.on("pointerover", () => bg.setFillStyle(0x46b958));
  bg.on("pointerout", () => bg.setFillStyle(0x2f8d43));
  bg.on("pointerdown", callback);

  return { bg, text };
}

function createTextures(scene) {
  const g = scene.make.graphics({ x: 0, y: 0, add: false });

  // Chão
  g.fillStyle(0x704326);
  g.fillRect(0, 0, 128, 120);
  g.fillStyle(0x55a936);
  g.fillRect(0, 0, 128, 15);
  g.fillStyle(0x8d6035);
  for (let i = 0; i < 8; i++) {
    g.fillRect((i * 19) % 120, 27 + (i * 13) % 80, 5, 4);
  }
  g.generateTexture("ground", 128, 120);
  g.clear();

  // Tratores
  vehicles.forEach((v, i) => {
    g.clear();

    if (v.type === "tractor") {
      // Rodas
      g.fillStyle(0x222222);
      g.fillCircle(43, 87, 23);
      g.fillCircle(116, 92, 16);

      g.fillStyle(0x999999);
      g.fillCircle(43, 87, 11);
      g.fillCircle(116, 92, 7);

      g.fillStyle(0x555555);
      g.fillCircle(43, 87, 5);
      g.fillCircle(116, 92, 3);

      // Corpo
      g.fillStyle(v.color);
      g.fillRoundedRect(21, 49, 111, 36, 7);
      g.fillRect(85, 61, 40, 16);

      // Capô
      g.fillStyle(v.color);
      g.fillRoundedRect(87, 39, 43, 31, 5);

      // Cabine
      g.fillStyle(0x343d36);
      g.fillRoundedRect(43, 20, 46, 43, 4);
      g.fillStyle(0x86d9ee);
      g.fillRect(49, 26, 34, 26);

      // Telhado
      g.fillStyle(v.color);
      g.fillRect(38, 16, 56, 8);

      // Farol e escapamento
      g.fillStyle(0xfff5a1);
      g.fillRect(126, 47, 7, 9);
      g.fillStyle(0x555555);
      g.fillRect(97, 22, 7, 22);

      // Detalhes
      g.fillStyle(0xffffff);
      g.fillRect(28, 55, 6, 4);
    } else {
      // Rodas da moto
      g.fillStyle(0x202020);
      g.fillCircle(35, 81, 15);
      g.fillCircle(113, 81, 15);

      g.fillStyle(0xaaaaaa);
      g.fillCircle(35, 81, 7);
      g.fillCircle(113, 81, 7);

      // Chassi
      g.lineStyle(9, 0x444444);
      g.lineBetween(35, 81, 59, 53);
      g.lineBetween(59, 53, 91, 78);
      g.lineBetween(91, 78, 113, 81);

      // Carenagem
      g.fillStyle(v.color);
      g.fillRoundedRect(48, 45, 50, 21, 8);
      g.fillTriangle(83, 46, 122, 49, 105, 61);

      // Banco
      g.fillStyle(0x242424);
      g.fillRoundedRect(49, 35, 37, 10, 4);

      // Guidão
      g.lineStyle(4, 0xcccccc);
      g.lineBetween(99, 39, 119, 30);
      g.lineBetween(115, 30, 126, 31);

      // Piloto estilizado
      g.fillStyle(0x333333);
      g.fillCircle(74, 20, 10);
      g.fillStyle(v.color === 0xffffff ? 0xffd34e : v.color);
      g.fillCircle(74, 18, 9);
      g.fillStyle(0x242424);
      g.fillRect(67, 29, 12, 17);

      g.fillStyle(0xfff2a1);
      g.fillCircle(124, 49, 4);
    }

    g.generateTexture("vehicle" + i, 150, 115);
  });

  g.clear();

  // Pedra
  g.fillStyle(0x777777);
  g.fillPoints([
    {x: 4, y: 43}, {x: 10, y: 20}, {x: 26, y: 5},
    {x: 44, y: 13}, {x: 54, y: 37}, {x: 43, y: 48}
  ], true);
  g.fillStyle(0xaaaaaa);
  g.fillTriangle(13, 22, 27, 9, 31, 26);
  g.generateTexture("rock", 60, 52);

  g.clear();

  // Fardo de feno
  g.fillStyle(0xc99a42);
  g.fillRoundedRect(2, 2, 56, 45, 5);
  g.lineStyle(3, 0x8a5e23);
  g.lineBetween(10, 5, 10, 43);
  g.lineBetween(28, 5, 28, 43);
  g.lineBetween(46, 5, 46, 43);
  g.generateTexture("hay", 60, 50);

  g.clear();

  // Galho
  g.lineStyle(10, 0x694225);
  g.lineBetween(2, 35, 78, 18);
  g.lineStyle(6, 0x694225);
  g.lineBetween(33, 28, 22, 9);
  g.lineBetween(54, 23, 65, 6);
  g.generateTexture("branch", 82, 45);

  g.clear();

  // Moeda
  g.fillStyle(0xffd42a);
  g.fillCircle(20, 20, 18);
  g.lineStyle(3, 0xfff19a);
  g.strokeCircle(20, 20, 14);
  g.fillStyle(0xc58a12);
  g.fillRect(17, 10, 6, 20);
  g.generateTexture("coin", 40, 40);

  g.clear();

  // Árvore
  g.fillStyle(0x694225);
  g.fillRect(21, 43, 12, 45);
  g.fillStyle(0x2e7d32);
  g.fillCircle(27, 27, 26);
  g.fillCircle(10, 41, 16);
  g.fillCircle(45, 41, 17);
  g.generateTexture("tree", 55, 90);

  g.destroy();
}

class BootScene extends Phaser.Scene {
  constructor() { super("BootScene"); }

  create() {
    createTextures(this);
    this.scene.start("MenuScene");
  }
}

class MenuScene extends Phaser.Scene {
  constructor() { super("MenuScene"); }

  create() {
    this.cameras.main.setBackgroundColor("#8bd6f5");

    this.add.rectangle(400, 500, 800, 200, 0x73bd46);
    for (let i = 0; i < 8; i++) {
      this.add.image(i * 120, 415, "tree").setScale(1.1);
    }

    addText(this, 400, 65, "🚜 JOGO DO TRATOR INFINITO", 31);
    addText(this, 400, 115, "Aventure-se pelo campo!", 20, "#fff6a0");
    addText(this, 400, 165, "🪙 Moedas: " + coins + "    🏆 Recorde: " + record, 19);

    this.add.image(400, 310, "vehicle" + selected).setScale(1.35);

    makeButton(this, 400, 405, "JOGAR", () => {
      this.scene.start("GameScene");
    });

    makeButton(this, 400, 465, "GARAGEM DE VEÍCULOS", () => {
      this.scene.start("ShopScene");
    });

    addText(this, 400, 550, "Toque na tela ou aperte ESPAÇO para pular", 15);
  }
}

class ShopScene extends Phaser.Scene {
  constructor() { super("ShopScene"); }

  create() {
    this.cameras.main.setBackgroundColor("#29452b");

    addText(this, 400, 27, "GARAGEM DE VEÍCULOS", 29);
    addText(this, 400, 60, "🪙 Suas moedas: " + coins, 20);

    vehicles.forEach((v, i) => {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const x = 140 + col * 260;
      const y = 125 + row * 112;
      const isUnlocked = unlocked.includes(i);
      const isSelected = selected === i;

      const panel = this.add.rectangle(
        x, y, 225, 98, isSelected ? 0x497f3c : 0x405342
      ).setStrokeStyle(2, isSelected ? 0xffdf55 : 0x9eb49e);

      this.add.image(x - 64, y - 6, "vehicle" + i).setScale(0.57);
      addText(this, x + 30, y - 29, v.name, 13);

      let label;
      if (isSelected) {
        label = "EQUIPADO";
      } else if (isUnlocked) {
        label = "EQUIPAR";
      } else {
        label = "COMPRAR " + v.price + " 🪙";
      }

      const btn = this.add.rectangle(x + 27, y + 20, 116, 30, 0x2f8d43)
        .setInteractive({ useHandCursor: true });
      const btnText = addText(this, x + 27, y + 20, label, 11);

      btn.on("pointerdown", () => {
        if (unlocked.includes(i)) {
          selected = i;
          saveProgress();
          this.scene.restart();
        } else if (coins >= v.price) {
          coins -= v.price;
          unlocked.push(i);
          selected = i;
          saveProgress();
          this.scene.restart();
        } else {
          btn.setFillStyle(0xb53a30);
          btnText.setText("FALTAM MOEDAS");
          this.time.delayedCall(900, () => {
            if (btnText.active) btnText.setText(label);
            if (btn.active) btn.setFillStyle(0x2f8d43);
          });
        }
      });
    });

    makeButton(this, 400, 555, "VOLTAR AO MENU", () => {
      this.scene.start("MenuScene");
    }, 230);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super("GameScene"); }

  create() {
    this.score = 0;
    this.collected = 0;
    this.lives = 3;
    this.speed = 280;
    this.jumpCount = 0;
    this.paused = false;
    this.gameOver = false;
    this.biome = 0;
    this.lastObstacleTime = 0;
    this.lastCoinTime = 0;
    this.lastBiomeChange = 0;
    this.lastGroundX = 0;

    this.cameras.main.setBackgroundColor("#8bd6f5");

    this.sky = this.add.rectangle(400, 300, 800, 600, 0x8bd6f5);
    this.hills = this.add.rectangle(400, 430, 800, 170, 0x75b74a);
    this.add.rectangle(400, 475, 800, 35, 0x4d9e34);

    this.trees = this.add.group();
    for (let i = 0; i < 9; i++) {
      this.trees.add(
        this.add.image(i * 110, 390, "tree").setScale(0.7).setAlpha(0.9)
      );
    }

    this.grounds = this.physics.add.staticGroup();
    for (let i = 0; i < 11; i++) {
      const ground = this.grounds.create(i * 128 + 64, 540, "ground");
      ground.refreshBody();
      this.lastGroundX = ground.x + 64;
    }

    this.player = this.physics.add.sprite(220, 390, "vehicle" + selected);
    this.player.setScale(0.75);
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(105, 58);
    this.player.body.setOffset(20, 48);
    this.player.setDepth(5);
    this.physics.add.collider(this.player, this.grounds, () => {
      this.jumpCount = 0;
    });

    this.obstacles = this.physics.add.group();
    this.coinsGroup = this.physics.add.group();

    this.physics.add.overlap(
      this.player, this.obstacles, this.hitObstacle, null, this
    );

    this.physics.add.overlap(
      this.player, this.coinsGroup, this.collectCoin, null, this
    );

    this.scoreText = addText(this, 110, 28, "Pontos: 0", 20).setScrollFactor(0);
    this.coinText = addText(this, 365, 28, "🪙 0", 20).setScrollFactor(0);
    this.livesText = addText(this, 560, 28, "❤️ 3", 20).setScrollFactor(0);
    this.biomeText = addText(this, 400, 65, "CAMPO", 16).setScrollFactor(0);

    this.pauseButton = this.add.rectangle(750, 30, 70, 40, 0x355b35)
      .setScrollFactor(0)
      .setInteractive({ useHandCursor: true });
    addText(this, 750, 30, "Ⅱ", 25).setScrollFactor(0);
    this.pauseButton.on("pointerdown", () => this.togglePause());

    this.input.keyboard.on("keydown-SPACE", () => this.jump());
    this.input.keyboard.on("keydown-UP", () => this.jump());
    this.input.keyboard.on("keydown-W", () => this.jump());
    this.input.on("pointerdown", (pointer) => {
      if (pointer.y > 75 && !this.gameOver && !this.paused) this.jump();
    });

    this.physics.world.setBounds(0, 0, 800, 600);
    this.physics.resume();
  }

  jump() {
    if (this.gameOver || this.paused) return;

    if (this.jumpCount < 2) {
      this.player.setVelocityY(this.jumpCount === 0 ? -470 : -430);
      this.jumpCount++;
    }
  }

  spawnObstacle(time) {
    const type = Phaser.Math.Between(0, 2);
    let key = "rock";
    let scale = 1;
    let y = 451;

    if (type === 1) {
      key = "hay";
      scale = 0.9;
      y = 450;
    }

    if (type === 2 && this.biome === 1) {
      key = "branch";
      scale = 0.9;
      y = 432;
    }

    const obstacle = this.obstacles.create(860, y, key);
    obstacle.setScale(scale);
    obstacle.setImmovable(true);
    obstacle.body.allowGravity = false;
    obstacle.body.setVelocityX(-this.speed);

    if (key === "rock") {
      obstacle.body.setSize(45, 35);
      obstacle.body.setOffset(7, 12);
    } else if (key === "hay") {
      obstacle.body.setSize(48, 40);
      obstacle.body.setOffset(6, 5);
    } else {
      obstacle.body.setSize(65, 17);
      obstacle.body.setOffset(8, 16);
    }

    obstacle.setData("passed", false);
    this.lastObstacleTime = time;
  }

  spawnCoin() {
    const coin = this.coinsGroup.create(
      860, Phaser.Math.Between(320, 405), "coin"
    );
    coin.setScale(0.75);
    coin.body.allowGravity = false;
    coin.setImmovable(true);
    coin.body.setVelocityX(-this.speed);
    coin.body.setCircle(15);
    this.lastCoinTime = this.time.now;
  }

  collectCoin(player, coin) {
    if (!coin.active) return;

    coin.destroy();
    this.collected++;
    coins++;
    save.set("coins", coins);
    this.coinText.setText("🪙 " + this.collected);
  }

  hitObstacle(player, obstacle) {
    if (this.gameOver || this.paused || !obstacle.active) return;

    obstacle.destroy();
    this.lives--;
    this.livesText.setText("❤️ " + this.lives);

    this.player.setTint(0xff7777);
    this.time.delayedCall(350, () => {
      if (this.player && this.player.active) this.player.clearTint();
    });

    if (this.lives <= 0) {
      this.endGame();
    }
  }

  togglePause() {
    if (this.gameOver) return;

    this.paused = !this.paused;

    if (this.paused) {
      this.physics.pause();
      this.add.rectangle(400, 300, 800, 600, 0x000000, 0.65)
        .setName("pauseOverlay").setDepth(20);

      addText(this, 400, 235, "JOGO PAUSADO", 34).setName("pauseTitle").setDepth(21);

      makeButton(this, 400, 310, "CONTINUAR", () => {
        this.children.list
          .filter(c => c.name === "pauseOverlay" || c.name === "pauseTitle")
          .forEach(c => c.destroy());

        this.children.list
          .filter(c => c.name === "pauseButtonTemp")
          .forEach(c => c.destroy());

        this.paused = false;
        this.physics.resume();
      }).bg.setDepth(22);
    } else {
      this.physics.resume();
    }
  }

  changeBiome(time) {
    if (time - this.lastBiomeChange < 18000) return;

    this.lastBiomeChange = time;
    this.biome = (this.biome + 1) % 4;

    const colors = [0x8bd6f5, 0x9ac5a0, 0xffb66b, 0x8b9cbd];
    const hillColors = [0x75b74a, 0x47784a, 0xa77b48, 0x687b91];
    const names = ["CAMPO", "FLORESTA", "DESERTO", "MONTANHAS"];

    this.sky.setFillStyle(colors[this.biome]);
    this.hills.setFillStyle(hillColors[this.biome]);
    this.biomeText.setText(names[this.biome]);

    this.trees.getChildren().forEach(tree => {
      if (this.biome === 1) {
        tree.setScale(1.05);
        tree.setAlpha(1);
      } else if (this.biome === 2) {
        tree.setScale(0.45);
        tree.setAlpha(0.65);
      } else if (this.biome === 3) {
        tree.setScale(0.8);
        tree.setAlpha(0.5);
      } else {
        tree.setScale(0.7);
        tree.setAlpha(0.9);
      }
    });
  }

  endGame() {
    if (this.gameOver) return;
    this.gameOver = true;
    this.physics.pause();

    const finalScore = Math.floor(this.score);
    if (finalScore > record) {
      record = finalScore;
    }

    coins += Math.floor(this.collected / 2);
    saveProgress();

    this.add.rectangle(400, 300, 800, 600, 0x000000, 0.72).setDepth(30);
    addText(this, 400, 175, "FIM DE JOGO!", 40).setDepth(31);
    addText(this, 400, 235, "Pontos: " + finalScore, 27).setDepth(31);
    addText(this, 400, 280, "Moedas coletadas: " + this.collected, 21).setDepth(31);
    addText(this, 400, 320, "Recorde: " + record, 22).setDepth(31);

    makeButton(this, 400, 395, "JOGAR NOVAMENTE", () => {
      this.scene.restart();
    }).bg.setDepth(32);

    makeButton(this, 400, 455, "VOLTAR AO MENU", () => {
      this.scene.start("MenuScene");
    }).bg.setDepth(32);
  }

  update(time, delta) {
    if (this.gameOver || this.paused) return;

    const dt = delta / 1000;
    this.score += dt * 10;
    this.speed = Math.min(280 + this.score * 0.35, 520);

    this.scoreText.setText("Pontos: " + Math.floor(this.score));

    // Movimento contínuo do cenário
    this.lastGroundX -= this.speed * dt;

    this.grounds.getChildren().forEach(ground => {
      ground.x -= this.speed * dt;
      ground.refreshBody();

      if (ground.x < -80) {
        ground.destroy();
      }
    });

    while (this.lastGroundX < 900) {
      const ground = this.grounds.create(
        this.lastGroundX + 64, 540, "ground"
      );
      ground.refreshBody();
      this.lastGroundX += 128;
    }

    this.trees.getChildren().forEach(tree => {
      tree.x -= this.speed * 0.25 * dt;
      if (tree.x < -70) tree.x = 870;
    });

    this.obstacles.getChildren().forEach(obstacle => {
      obstacle.body.setVelocityX(-this.speed);
      if (obstacle.x < -100) obstacle.destroy();
    });

    this.coinsGroup.getChildren().forEach(coin => {
      coin.body.setVelocityX(-this.speed);
      coin.rotation += dt * 2;
      if (coin.x < -60) coin.destroy();
    });

    if (time - this.lastObstacleTime > Phaser.Math.Between(1900, 2900)) {
      this.spawnObstacle(time);
    }

    if (time - this.lastCoinTime > 1500) {
      this.spawnCoin();
    }

    this.changeBiome(time);

    // Mantém o pulo dentro dos limites
    if (this.player.y > 570) {
      this.endGame();
    }
  }
}

const config = {
  type: Phaser.AUTO,
  parent: "game",
  width: W,
  height: H,
  backgroundColor: "#8bd6f5",
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: "arcade",
    arcade: {
      gravity: { y: 1150 },
      debug: false
    }
  },
  scene: [BootScene, MenuScene, ShopScene, GameScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
