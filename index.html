
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo do Trator Infinito</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#17251a;color:white;
  font-family:Arial,sans-serif;overflow:hidden;
  touch-action:manipulation
}
#topo{
  min-height:52px;background:#203d25;
  display:flex;align-items:center;justify-content:space-around;
  gap:5px;padding:6px;flex-wrap:wrap
}
button{
  border:2px solid #d8e7c5;border-radius:9px;
  background:#376b35;color:white;padding:9px 11px;
  font-weight:bold;font-size:13px;cursor:pointer
}
button:active{transform:scale(.96)}
#game{width:100%;height:calc(100dvh - 120px);min-height:250px}
#game canvas{display:block;margin:auto;max-width:100%;max-height:100%}
#baixo{
  height:68px;display:flex;justify-content:center;
  align-items:center;gap:12px;background:#203d25
}
#pular{font-size:20px;background:#d59a26;color:#171717;
  min-width:125px;height:52px}
#frear{background:#a8392c;min-width:85px;height:48px}
#painel{
  display:none;position:fixed;inset:0;z-index:10;
  background:#101b10ed;overflow:auto;padding:15px;
  text-align:center
}
#painel h2{color:#f0d36b}
#itens{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;max-width:650px;margin:15px auto
}
.item{
  background:#29452d;border:1px solid #829e70;
  padding:12px;border-radius:12px
}
.item button{margin-top:8px}
#fechar{margin:12px}
.pequeno{font-size:12px;color:#d7e2d0}
</style>
</head>

<body>

<div id="topo">
  <button onclick="abrirGaragem()">🚜 Garagem</button>
  <button onclick="abrirCarreta()">🛒 Carreta</button>
  <button onclick="pausar()">⏸ Pausar</button>
  <span>🪙 <b id="moedas">0</b></span>
  <span>❤️ <b id="vidas">3</b></span>
  <span>🏆 <b id="recorde">0</b></span>
</div>

<div id="game"></div>

<div id="baixo">
  <button id="frear" onclick="frear()">FREAR</button>
  <button id="pular">⬆ PULAR</button>
</div>

<div id="painel">
  <h2 id="tituloPainel">GARAGEM</h2>
  <p id="descricaoPainel"></p>
  <div id="itens"></div>
  <button id="fechar" onclick="fecharPainel()">VOLTAR AO JOGO</button>
</div>

<script>
const salvar = {
  ler(chave, padrao) {
    try {
      const v = localStorage.getItem(chave);
      return v === null ? padrao : JSON.parse(v);
    } catch(e) { return padrao; }
  },
  gravar(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); }
    catch(e) {}
  }
};

let moedas = salvar.ler("trator_moedas", 0);
let recorde = salvar.ler("trator_recorde", 0);
let carretaComprada = salvar.ler("trator_carreta", false);
let carretaEngatada = salvar.ler("trator_carreta_engatada", false);
let selecionado = salvar.ler("trator_veiculo", 0);
let jogoPausado = false;
let painelAberto = false;
let distancia = 0;
let vidas = 3;
let pulos = 0;
let velocidade = 300;
let invencivel = 0;
let proximoObstaculo = 0;
let proximaMoeda = 0;
let freando = false;
let jogoEncerrado = false;

const veiculos = [
 {nome:"Trator Verde",tipo:"trator",cor:0x329447,preco:0},
 {nome:"Trator Vermelho",tipo:"trator",cor:0xc93830,preco:150},
 {nome:"Trator Azul",tipo:"trator",cor:0x287bc0,preco:250},
 {nome:"Trator Amarelo",tipo:"trator",cor:0xe6b92c,preco:350},
 {nome:"Trator Rural",tipo:"trator",cor:0x7a9b36,preco:450},
 {nome:"Trator Premium",tipo:"trator",cor:0xe5e5e5,preco:600},
 {nome:"Moto de Trilha",tipo:"moto",cor:0xd92f25,preco:0},
 {nome:"Moto Azul",tipo:"moto",cor:0x298bd1,preco:180},
 {nome:"Moto Verde",tipo:"moto",cor:0x40b95a,preco:280},
 {nome:"Moto Amarela",tipo:"moto",cor:0xe5bd2c,preco:380},
 {nome:"Moto Racing",tipo:"moto",cor:0xececec,preco:500},
 {nome:"Moto Especial",tipo:"moto",cor:0xa33bd0,preco:650}
];

let comprados = salvar.ler("trator_comprados", [0,6]);

function atualizarHUD(){
 document.getElementById("moedas").textContent=moedas;
 document.getElementById("vidas").textContent=vidas;
 document.getElementById("recorde").textContent=recorde;
}

function guardar(){
 salvar.gravar("trator_moedas",moedas);
 salvar.gravar("trator_recorde",recorde);
 salvar.gravar("trator_carreta",carretaComprada);
 salvar.gravar("trator_carreta_engatada",carretaEngatada);
 salvar.gravar("trator_veiculo",selecionado);
 salvar.gravar("trator_comprados",comprados);
}

function abrirPainel(titulo,descricao){
 painelAberto=true;
 jogoPausado=true;
 document.getElementById("painel").style.display="block";
 document.getElementById("tituloPainel").textContent=titulo;
 document.getElementById("descricaoPainel").textContent=descricao||"";
 document.getElementById("itens").innerHTML="";
}

function adicionarItem(nome,descricao,acao,texto){
 const div=document.createElement("div");
 div.className="item";
 const h=document.createElement("b");
 h.textContent=nome;
 const p=document.createElement("p");
 p.textContent=descricao;
 const b=document.createElement("button");
 b.textContent=texto;
 b.onclick=acao;
 div.append(h,p,b);
 document.getElementById("itens").appendChild(div);
}

function abrirGaragem(){
 abrirPainel("🚜 GARAGEM","Escolha seu veículo. Os preços são pagos com moedas do jogo.");
 veiculos.forEach((v,i)=>{
   const tem=comprados.includes(i);
   const atual=selecionado===i;
   adicionarItem(
     v.nome,
     (v.tipo==="trator"?"Trator agrícola":"Moto de trilha")+" • "+
     (v.preco===0?"Inicial":v.preco+" moedas"),
     ()=>{
       if(!comprados.includes(i)){
         if(moedas<v.preco){alert("Você não tem moedas suficientes!");return;}
         moedas-=v.preco;
         comprados.push(i);
       }
       selecionado=i;
       if(v.tipo==="moto")carretaEngatada=false;
       guardar();atualizarHUD();abrirGaragem();
     },
     atual?"SELECIONADO":tem?"USAR": "COMPRAR"
   );
 });
}

function abrirCarreta(){
 abrirPainel("🛒 CARRETA","A carreta é um acessório separado, que acompanha o trator.");
 adicionarItem(
   "Carreta rural vermelha",
   "Preço: 250 moedas. Reboque decorativo que acompanha o trator durante a partida.",
   ()=>{
     if(carretaComprada){alert("Você já comprou a carreta!");return;}
     if(moedas<250){alert("Você precisa de 250 moedas para comprar a carreta.");return;}
     moedas-=250;carretaComprada=true;guardar();atualizarHUD();abrirCarreta();
   },
   carretaComprada?"COMPRADA":"COMPRAR • 250 🪙"
 );
 adicionarItem(
   "Engatar / desengatar",
   !carretaComprada?"Compre a carreta primeiro.":
   selecionado===undefined?"Selecione um veículo.":
   veiculos[selecionado].tipo!=="trator"?"Selecione um trator para usar a carreta.":
   carretaEngatada?"A carreta está engatada.":"A carreta está desengatada.",
   ()=>{
     if(!carretaComprada){alert("Compre a carreta primeiro.");return;}
     if(veiculos[selecionado].tipo!=="trator"){
       alert("A carreta só pode ser engatada em um trator.");return;
     }
     carretaEngatada=!carretaEngatada;
     guardar();abrirCarreta();
   },
   !carretaComprada?"BLOQUEADO":carretaEngatada?"DESENGATAR":"ENGATAR"
 );
}

function fecharPainel(){
 document.getElementById("painel").style.display="none";
 painelAberto=false;
 jogoPausado=false;
 if(sceneJogo && sceneJogo.scene.isActive()){
   sceneJogo.physics.world.resume();
 }
}

function pausar(){
 if(painelAberto)return;
 jogoPausado=!jogoPausado;
 if(sceneJogo){
   if(jogoPausado)sceneJogo.physics.world.pause();
   else sceneJogo.physics.world.resume();
 }
}

function frear(){freando=true;setTimeout(()=>freando=false,500)}

document.getElementById("pular").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(sceneJogo)sceneJogo.pular();
});

let sceneJogo=null;

const config={
 type:Phaser.AUTO,
 parent:"game",
 backgroundColor:"#8fd5f2",
 scale:{
   mode:Phaser.Scale.RESIZE,
   autoCenter:Phaser.Scale.CENTER_BOTH,
   width:900,height:500
 },
 physics:{
   default:"arcade",
   arcade:{gravity:{y:1000},debug:false}
 },
 scene:{preload,create,update}
};

const game=new Phaser.Game(config);

function preload(){}

function create(){
 sceneJogo=this;
 this.chaoY=this.scale.height-75;
 this.fundo=this.add.graphics();
 this.chao=this.add.rectangle(
   this.scale.width/2,this.chaoY+40,
   this.scale.width+100,100,0x6c9b42
 );
 this.physics.add.existing(this.chao,true);

 this.jogador=this.physics.add.sprite(130,this.chaoY-35,"");
 this.jogador.setVisible(false);
 this.jogador.setSize(65,65);
 this.jogador.setCollideWorldBounds(true);
 this.jogador.body.setGravityY(1000);
 this.jogador.body.setMaxVelocity(650,850);

 this.desenho=this.add.graphics();
 this.carretaDesenho=this.add.graphics();
 this.obstaculos=this.physics.add.group();
 this.moedasGrupo=this.physics.add.group();

 this.physics.add.collider(this.jogador,this.chao,()=>{
   pulos=0;
 });

 this.physics.add.overlap(this.jogador,this.obstaculos,(j,o)=>{
   if(invencivel>0 || jogoEncerrado)return;
   o.destroy();
   vidas--;
   invencivel=1.3;
   atualizarHUD();
   if(vidas<=0)fimDeJogo.call(this);
 });

 this.physics.add.overlap(this.jogador,this.moedasGrupo,(j,m)=>{
   m.destroy();
   moedas+=10;
   guardar();atualizarHUD();
 });

 this.input.on("pointerdown",pointer=>{
   if(pointer.y>this.scale.height-75 && !painelAberto)this.pular();
 });

 this.teclas=this.input.keyboard.addKeys({
   space:"SPACE",up:"UP",w:"W",p:"P"
 });

 this.evento=0;
 this.moedaEvento=0;
 this.textoFim=null;
 atualizarHUD();
}

function pular(){
 if(jogoPausado||jogoEncerrado||!sceneJogo)return;
 const s=sceneJogo;
 if(pulos>=2)return;
 pulos++;
 s.jogador.setVelocityY(pulos===1?-440:-390);
}

function fimDeJogo(){
 jogoEncerrado=true;
 this.physics.world.pause();
 recorde=Math.max(recorde,Math.floor(distancia));
 guardar();atualizarHUD();
 const cx=this.scale.width/2,cy=this.scale.height/2;
 this.textoFim=this.add.text(cx,cy,
   "FIM DE JOGO\n\nDistância: "+Math.floor(distancia)+
   "\n\nToque para recomeçar",
   {fontFamily:"Arial",fontSize:"27px",fontStyle:"bold",
    color:"#ffffff",align:"center",backgroundColor:"#263b26",
    padding:{x:18,y:18}}
 ).setOrigin(.5).setDepth(100);
 this.input.once("pointerdown",()=>{
   jogoEncerrado=false;vidas=3;distancia=0;pulos=0;
   this.scene.restart();
 });
}

function desenharTrator(g,x,y,cor,escala=1){
 g.save();
 g.translateCanvas(x,y);
 g.scaleCanvas(escala,escala);
 const ret=(x,y,w,h,c)=>{
   g.fillStyle(c,1);g.fillRect(x,y,w,h);
 };
 const circ=(x,y,r,c)=>{
   g.fillStyle(c,1);g.fillCircle(x,y,r);
 };
 // Pneus grandes e rodas detalhadas
 circ(-22,13,20,0x171717);circ(-22,13,12,0x555555);
 circ(-22,13,7,0xb5b5b5);circ(29,13,12,0x171717);
 circ(29,13,7,0x666666);circ(29,13,4,0xc5c5c5);
 // Sulcos dos pneus
 g.lineStyle(2,0x777777,1);
 for(let a=0;a<8;a++){
   const ang=a*Math.PI/4;
   g.lineBetween(-22+Math.cos(ang)*14,13+Math.sin(ang)*14,
                 -22+Math.cos(ang)*19,13+Math.sin(ang)*19);
 }
 // Chassi e capô
 ret(-34,-3,65,12,0x343b32);
 ret(-7,-19,40,20,cor);
 ret(20,-24,18,7,0x252525);
 // Grade frontal
 ret(28,-15,9,12,0x292929);
 for(let i=0;i<4;i++)ret(29,-14+i*3,7,1,0xb9b9b9);
 // Farol
 circ(32,-19,4,0xfff3b0);
 circ(32,-19,2,0xffffff);
 // Cabine
 ret(-21,-42,25,25,cor);
 ret(-17,-39,17,15,0x292e2a);
 ret(-15,-37,13,11,0x82d7ef);
 ret(-23,-44,29,4,0x202820);
 ret(-22,-16,5,12,0x262626);
 // Escape e detalhes
 ret(7,-32,4,14,0x444444);
 ret(8,-37,3,7,0x242424);
 ret(-32,-7,9,5,0x242424);
 // Para-lamas
 g.lineStyle(4,cor,1);
 g.strokeCircle(-22,13,21);
 g.restore();
}

function desenharMoto(g,x,y,cor,escala=1){
 g.save();g.translateCanvas(x,y);g.scaleCanvas(escala,escala);
 const ret=(x,y,w,h,c)=>{g.fillStyle(c,1);g.fillRect(x,y,w,h)};
 const circ=(x,y,r,c)=>{g.fillStyle(c,1);g.fillCircle(x,y,r)};
 circ(-23,12,12,0x151515);circ(-23,12,7,0x777777);
 circ(25,12,12,0x151515);circ(25,12,7,0x777777);
 g.lineStyle(4,0xb5b5b5,1);
 g.lineBetween(-23,12,-8,-5);g.lineBetween(-8,-5,25,12);
 g.lineBetween(-8,-5,6,12);g.lineBetween(6,12,25,12);
 ret(-14,-10,26,8,cor);
 ret(-6,-16,13,8,cor);
 ret(-4,-22,5,7,0x252525);
 ret(17,-3,13,5,0x303030);
 circ(30,-5,4,0xfff0b0);
 // Guidão e suspensão
 g.lineStyle(3,0x333333,1);
 g.lineBetween(22,-7,28,-17);g.lineBetween(22,-7,31,-7);
 g.lineBetween(-22,12,-14,-10);
 // Piloto
 circ(0,-29,6,0x252525);
 ret(-4,-25,9,12,0x343b40);
 g.lineStyle(3,0x222222,1);
 g.lineBetween(-1,-19,-8,-8);g.lineBetween(2,-19,13,-12);
 g.restore();
}

function desenharCarreta(g,x,y){
 g.clear();
 g.fillStyle(0x303030,1);g.fillRect(x-3,y-8,30,4);
 g.fillStyle(0x9d2822,1);g.fillRect(x+20,y-28,58,26);
 g.fillStyle(0xd44537,1);g.fillRect(x+23,y-25,52,20);
 g.fillStyle(0x70201b,1);g.fillRect(x+20,y-5,58,4);
 g.fillStyle(0x222222,1);g.fillCircle(x+34,y+2,8);
 g.fillStyle(0x777777,1);g.fillCircle(x+34,y+2,4);
 g.fillStyle(0x222222,1);g.fillCircle(x+68,y+2,8);
 g.fillStyle(0x777777,1);g.fillCircle(x+68,y+2,4);
 g.lineStyle(2,0xe9c6b8,1);
 g.lineBetween(x+27,y-20,x+70,y-20);
}

function update(time,delta){
 if(jogoPausado||jogoEncerrado)return;
 const dt=delta/1000;
 if(!this.jogador)return;

 if(this.teclas.space.isDown||this.teclas.up.isDown||this.teclas.w.isDown){
   if(!this.teclaAnterior)this.pular();
   this.teclaAnterior=true;
 }else this.teclaAnterior=false;

 if(this.teclas.p.isDown){
   if(!this.pAnterior)pausar();
   this.pAnterior=true;
 }else this.pAnterior=false;

 if(invencivel>0)invencivel-=dt;

 const w=this.scale.width,h=this.scale.height;
 this.chaoY=h-75;
 this.chao.setPosition(w/2,this.chaoY+40);
 this.chao.width=w+100;
 this.chao.body.updateFromGameObject();

 velocidade=freando?100:Math.min(480,300+distancia*0.025);
 distancia+=velocidade*dt/20;

 // Fundo em movimento e chão rural
 this.fundo.clear();
 this.fundo.fillGradientStyle(0x70c9ee,0x70c9ee,0xd3edfa,0xd3edfa,1);
 this.fundo.fillRect(0,0,w,h);
 this.fundo.fillStyle(0x82b968,1);
 this.fundo.fillTriangle(0,this.chaoY,100,this.chaoY-100,240,this.chaoY);
 this.fundo.fillTriangle(200,this.chaoY,400,this.chaoY-75,570,this.chaoY);
 this.fundo.fillStyle(0x4b8039,1);
 this.fundo.fillRect(0,this.chaoY+8,w,h-this.chaoY);
 this.fundo.fillStyle(0xc4a66a,1);
 this.fundo.fillRect(0,this.chaoY+15,w,7);

 this.evento+=dt;
 this.moedaEvento+=dt;

 if(this.evento>Math.max(0.85,1.55-distancia/400)){
   this.evento=0;
   const x=w+30;
   const tipo=Math.random();
   const ob=this.physics.add.image(x,this.chaoY-15,"");
   ob.setVisible(false);
   ob.body.setAllowGravity(false);
   ob.setImmovable(true);
   ob.setSize(tipo<0.5?35:45, tipo<0.5?35:25);
   ob.tipo=tipo<0.5?"pedra":"fardo";
   this.obstaculos.add(ob);
   ob.setData("tipo",ob.tipo);
 }

 if(this.moedaEvento>1.1){
   this.moedaEvento=0;
   const m=this.physics.add.image(w+25,this.chaoY-65-Math.random()*70,"");
   m.setVisible(false);
   m.body.setAllowGravity(false);
   m.setCircle(13);
   this.moedasGrupo.add(m);
 }

 this.obstaculos.getChildren().forEach(o=>{
   o.x-=velocidade*dt;
   if(o.x<-60)o.destroy();
 });
 this.moedasGrupo.getChildren().forEach(m=>{
   m.x-=velocidade*dt;
   if(m.x<-40)m.destroy();
 });

 this.desenho.clear();
 const v=veiculos[selecionado]||veiculos[0];
 if(v.tipo==="trator")desenharTrator(this.desenho,this.jogador.x,this.jogador.y,v.cor);
 else desenharMoto(this.desenho,this.jogador.x,this.jogador.y,v.cor);

 // Obstáculos desenhados à frente do veículo
 this.obstaculos.getChildren().forEach(o=>{
   if(o.tipo==="pedra"){
     this.desenho.fillStyle(0x69645b,1);
     this.desenho.fillTriangle(o.x-20,this.chaoY,o.x-13,this.chaoY-29,o.x+12,this.chaoY);
     this.desenho.fillStyle(0x9a9488,1);
     this.desenho.fillTriangle(o.x-10,this.chaoY-4,o.x-7,this.chaoY-22,o.x+7,this.chaoY-4);
   }else{
     this.desenho.fillStyle(0xcaa35c,1);
     this.desenho.fillRoundedRect(o.x-22,this.chaoY-26,44,25,5);
     this.desenho.lineStyle(2,0x8d6939,1);
     this.desenho.strokeCircle(o.x,this.chaoY-14,10);
   }
 });
 this.moedasGrupo.getChildren().forEach(m=>{
   this.desenho.fillStyle(0xffd52a,1);
   this.desenho.fillCircle(m.x,m.y,11);
   this.desenho.lineStyle(2,0xfff1a0,1);
   this.desenho.strokeCircle(m.x,m.y,8);
   this.desenho.fillStyle(0x9a6d00,1);
   this.desenho.fillRect(m.x-2,m.y-5,4,10);
 });

 // A carreta só acompanha tratores quando comprada e engatada
 if(carretaComprada&&carretaEngatada&&v.tipo==="trator"){
   desenharCarreta(this.carretaDesenho,this.jogador.x-115,this.jogador.y+16);
 }else{
   this.carretaDesenho.clear();
 }

 if(invencivel>0){
   this.desenho.setAlpha(Math.floor(time/100)%2===0?0.3:1);
 }else this.desenho.setAlpha(1);

 // Ajuste de colisão do veículo
 this.jogador.setPosition(130,Phaser.Math.Clamp(this.jogador.y,30,this.chaoY-5));
 this.jogador.body.setSize(veiculos[selecionado].tipo==="trator"?63:58,45);
 this.jogador.body.setOffset(0,0);

 if(Math.floor(distancia)>recorde){
   recorde=Math.floor(distancia);
   atualizarHUD();
   guardar();
 }
}

function pausarJogoSeguro(){
 if(sceneJogo)sceneJogo.physics.world.pause();
}
</script>

</body>
</html>
