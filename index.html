<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo do Trator Infinito</title>

    <!-- Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>

<body>

<script>

console.log("Iniciando jogo...");


// =====================================================
// VARIÁVEIS
// =====================================================

let totalCoins = 0;

let tractorColor = 0x2e7d32;

let unlocked = {
    green: true,
    red: false,
    blue: false
};

let score = 0;
let coins = 0;
let speed = 220;

let tractor;
let ground;
let obstacles;
let coinGroup;

let scoreText;
let coinsText;
let speedText;

let gameOver = false;


// =====================================================
// FUNÇÃO PARA CRIAR TEXTURAS
// =====================================================

function createTextures(scene) {

    // TRATOR
    if (!scene.textures.exists("tractor")) {

        let g = scene.make.graphics({
            x: 0,
            y: 0,
            add: false
        });

        g.fillStyle(0x2e7d32);
        g.fillRect(5, 25, 60, 25);

        g.fillStyle(0x1565c0);
        g.fillRect(35, 5, 25, 25);

        g.fillStyle(0x111111);

        g.fillCircle(18, 50, 12);
        g.fillCircle(52, 50, 12);

        g.generateTexture("tractor", 70, 65);

        g.destroy();
    }


    // CHÃO
    if (!scene.textures.exists("ground")) {

        let g = scene.make.graphics({
            x: 0,
            y: 0,
            add: false
        });

        g.fillStyle(0x4caf50);
        g.fillRect(0, 0, 800, 20);

        g.fillStyle(0x795548);
        g.fillRect(0, 20, 800, 100);

        g.generateTexture("ground", 800, 120);

        g.destroy();
    }


    // PEDRA
    if (!scene.textures.exists("rock")) {

        let g = scene.make.graphics({
            x: 0,
            y: 0,
            add: false
        });

        g.fillStyle(0x777777);
        g.fillCircle(18, 18, 18);

        g.generateTexture("rock", 36, 36);

        g.destroy();
    }


    // RAMPA
    if (!scene.textures.exists("ramp")) {

        let g = scene.make.graphics({
            x: 0,
            y: 0,
            add: false
        });

        g.fillStyle(0x8d6e63);

        g.beginPath();
        g.moveTo(0, 45);
        g.lineTo(45, 0);
        g.lineTo(45, 45);
        g.closePath();
        g.fillPath();

        g.generateTexture("ramp", 60, 45);

        g.destroy();
    }


    // ÁGUA
    if (!scene.textures.exists("water")) {

        let g = scene.make.graphics({
            x: 0,
            y: 0,
            add: false
        });

        g.fillStyle(0x29b6f6);
        g.fillRect(0, 0, 70, 30);

        g.generateTexture("water", 70, 30);

        g.destroy();
    }


    // MOEDA
    if (!scene.textures.exists("coin")) {

        let g = scene.make.graphics({
            x: 0,
            y: 0,
            add: false
        });

        g.fillStyle(0xffd700);
        g.fillCircle(12, 12, 12);

        g.lineStyle(2, 0xffa000);
        g.strokeCircle(12, 12, 10);

        g.generateTexture("coin", 24, 24);

        g.destroy();
    }
}


// =====================================================
// MENU
// =====================================================

class MenuScene extends Phaser.Scene {

    constructor() {
        super("Menu");
    }


    create() {

        this.cameras.main.setBackgroundColor("#87CEEB");


        this.add.text(
            400,
            100,
            "🚜 JOGO DO TRATOR",
            {
                fontSize: "42px",
                color: "#ffffff",
                fontStyle: "bold"
            }
        ).setOrigin(0.5);


        this.add.text(
            400,
            160,
            "INFINITO",
            {
                fontSize: "30px",
                color: "#ffff00",
                fontStyle: "bold"
            }
        ).setOrigin(0.5);


        this.add.text(
            400,
            220,
            "Moedas: " + totalCoins + " 🪙",
            {
                fontSize: "24px",
                color: "#ffd700"
            }
        ).setOrigin(0.5);


        // JOGAR

        let play = this.add.text(
            400,
            300,
            "▶ JOGAR",
            {
                fontSize: "32px",
                color: "#ffffff",
                backgroundColor: "#2e7d32",
                padding: {
                    left: 25,
                    right: 25,
                    top: 12,
                    bottom: 12
                }
            }
        )
        .setOrigin(0.5)
        .setInteractive();


        play.on("pointerdown", () => {

            this.scene.start("Game");

        });


        // LOJA

        this.add.text(
            400,
            390,
            "LOJA — 10 moedas",
            {
                fontSize: "22px",
                color: "#ffffff"
            }
        ).setOrigin(0.5);


        let red = this.add.text(
            250,
            450,
            unlocked.red ? "🔴 VERMELHO" : "COMPRAR 🔴",
            {
                fontSize: "18px",
                color: "#ffffff",
                backgroundColor: "#d32f2f",
                padding: 10
            }
        )
        .setOrigin(0.5)
        .setInteractive();


        red.on("pointerdown", () => {

            if (!unlocked.red) {

                if (totalCoins >= 10) {

                    totalCoins -= 10;
                    unlocked.red = true;

                } else {

                    return;

                }

            }

            tractorColor = 0xff4444;

            this.scene.restart();

        });


        let blue = this.add.text(
            550,
            450,
            unlocked.blue ? "🔵 AZUL" : "COMPRAR 🔵",
            {
                fontSize: "18px",
                color: "#ffffff",
                backgroundColor: "#1976d2",
                padding: 10
            }
        )
        .setOrigin(0.5)
        .setInteractive();


        blue.on("pointerdown", () => {

            if (!unlocked.blue) {

                if (totalCoins >= 10) {

                    totalCoins -= 10;
                    unlocked.blue = true;

                } else {

                    return;

                }

            }

            tractorColor = 0x4444ff;

            this.scene.restart();

        });


        this.add.text(
            400,
            540,
            "Use ↑ ou ESPAÇO para pular",
            {
                fontSize: "18px",
                color: "#ffffff"
            }
        ).setOrigin(0.5);

    }

}


// =====================================================
// JOGO
// =====================================================

class GameScene extends Phaser.Scene {

    constructor() {
        super("Game");
    }


    create() {

        createTextures(this);

        gameOver = false;

        score = 0;
        coins = 0;
        speed = 220;


        // FUNDO

        this.cameras.main.setBackgroundColor("#87CEEB");


        // CHÃO

        ground =
            this.physics.add.staticGroup();


        for (let x = 400; x < 8000; x += 800) {

            ground
                .create(x, 550, "ground")
                .refreshBody();

        }


        // TRATOR

        tractor =
            this.physics.add.sprite(
                200,
                400,
                "tractor"
            );


        tractor.setTint(tractorColor);

        tractor.setCollideWorldBounds(false);


        // OBSTÁCULOS

        obstacles =
            this.physics.add.staticGroup();


        // MOEDAS

        coinGroup =
            this.physics.add.group();


        // COLISÃO CHÃO

        this.physics.add.collider(
            tractor,
            ground
        );


        // COLISÃO OBSTÁCULOS

        this.physics.add.collider(
            tractor,
            obstacles,
            () => {

                endGame();

            }
        );


        // MOEDAS

        this.physics.add.overlap(
            tractor,
            coinGroup,
            collectCoin,
            null,
            this
        );


        // CÂMERA

        this.cameras.main.startFollow(
            tractor,
            true,
            0.08,
            0.08,
            -200,
            100
        );


        // HUD

        scoreText =
            this.add.text(
                20,
                20,
                "Distância: 0m",
                {
                    fontSize: "22px",
                    color: "#000000",
                    fontStyle: "bold"
                }
            )
            .setScrollFactor(0);


        coinsText =
            this.add.text(
                20,
                50,
                "Moedas: 0 🪙",
                {
                    fontSize: "22px",
                    color: "#8b6508",
                    fontStyle: "bold"
                }
            )
            .setScrollFactor(0);


        speedText =
            this.add.text(
                780,
                20,
                "Velocidade: 1x",
                {
                    fontSize: "20px",
                    color: "#005500",
                    fontStyle: "bold"
                }
            )
            .setOrigin(1, 0)
            .setScrollFactor(0);


        // PRIMEIROS OBSTÁCULOS

        createObstacle(this, 700);
        createObstacle(this, 1100);
        createObstacle(this, 1550);
        createObstacle(this, 2050);


        // CONTROLES

        this.input.keyboard.on(
            "keydown-UP",
            jump,
            this
        );


        this.input.keyboard.on(
            "keydown-SPACE",
            jump,
            this
        );

    }


    update() {

        if (gameOver) {
            return;
        }


        // VELOCIDADE

        tractor.setVelocityX(speed);


        // DISTÂNCIA

        score =
            Math.floor(
                (tractor.x - 200) / 10
            );


        scoreText.setText(
            "Distância: " +
            score +
            "m"
        );


        coinsText.setText(
            "Moedas: " +
            coins +
            " 🪙"
        );


        // AUMENTA VELOCIDADE

        let multiplier =
            1 +
            Math.floor(score / 100) *
            0.15;


        speed =
            220 * multiplier;


        speedText.setText(
            "Velocidade: " +
            multiplier.toFixed(2) +
            "x"
        );


        // GERA NOVOS OBSTÁCULOS

        if (
            tractor.x >
            lastObstacleX - 500
        ) {

            createObstacle(
                this,
                lastObstacleX + Phaser.Math.Between(450, 700)
            );

        }


        // QUEDA

        if (tractor.y > 700) {

            endGame();

        }

    }

}


// =====================================================
// FUNÇÕES DO JOGO
// =====================================================

let lastObstacleX = 2050;


function createObstacle(scene, x) {

    let type =
        Phaser.Math.Between(1, 3);


    let obstacle;


    if (type === 1) {

        obstacle =
            scene.physics.add.staticImage(
                x,
                500,
                "rock"
            );

    }

    else if (type === 2) {

        obstacle =
            scene.physics.add.staticImage(
                x,
                500,
                "ramp"
            );

    }

    else {

        obstacle =
            scene.physics.add.staticImage(
                x,
                510,
                "water"
            );

    }


    obstacles.add(obstacle);


    // MOEDAS

    let amount =
        Phaser.Math.Between(1, 3);


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        let coin =
            coinGroup.create(
                x + i * 35 - 35,
                420,
                "coin"
            );


        coin.body.setAllowGravity(false);

    }


    lastObstacleX = x;

}


// =====================================================
// PULO
// =====================================================

function jump() {

    if (gameOver) {
        return;
    }


    if (
        tractor.body.blocked.down ||
        tractor.body.touching.down
    ) {

        tractor.setVelocityY(-380);

    }

}


// =====================================================
// PEGAR MOEDA
// =====================================================

function collectCoin(tractor, coin) {

    coin.destroy();

    coins++;

    totalCoins++;

}


// =====================================================
// GAME OVER
// =====================================================

function endGame() {

    if (gameOver) {
        return;
    }


    gameOver = true;


    tractor.setVelocity(0, 0);

    tractor.setTint(0x555555);


    let scene =
        tractor.scene;


    scene.add.text(
        400,
        200,
        "FIM DE JOGO",
        {
            fontSize: "48px",
            color: "#ff0000",
            fontStyle: "bold"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);


    scene.add.text(
        400,
        270,
        `Você percorreu ${score}m e pegou ${coins} moedas!`,
        {
            fontSize: "20px",
            color: "#000000",
            fontStyle: "bold"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);


    let menu =
        scene.add.text(
            400,
            350,
            "CLIQUE AQUI PARA VOLTAR AO MENU",
            {
                fontSize: "18px",
                color: "#ffffff",
                backgroundColor: "#333333",
                padding: 12
            }
        )
        .setOrigin(0.5)
        .setInteractive()
        .setScrollFactor(0);


    menu.on(
        "pointerdown",
        () => {

            scene.scene.start("Menu");

        }
    );

}


// =====================================================
// CONFIGURAÇÃO PHASER
// =====================================================

const config = {

    type: Phaser.AUTO,

    width: 800,

    height: 600,

    backgroundColor: "#87CEEB",

    physics: {

        default: "arcade",

        arcade: {

            gravity: {
                y: 900
            },

            debug: false

        }

    },

    scale: {

        mode: Phaser.Scale.FIT,

        autoCenter:
            Phaser.Scale.CENTER_BOTH

    },

    scene: [
        MenuScene,
        GameScene
    ]

};


// =====================================================
// INICIAR
// =====================================================

window.onload = function() {

    console.log("Phaser carregado.");

    new Phaser.Game(config);

};

</script>

</body>
    </html>
